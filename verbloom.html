  "I set down this account so others may benefit from my experience.": "Я записав цю розповідь, щоб інші могли отримати користь від мого досвіду.",
  "I should know that person's name, but I'm drawing a blank.": "Я повинен знати ім'я цієї людини, але я малюю порожнечу.",
  "I stayed up late to watch a movie, and my entire sleeping schedule has been out of kilter ever since.": "Я прокинулася до пізнього часу, щоб подивитися фільм, і весь мій графік сну з тих пір не виконується.",
  "I think I bit off more than I could chew when I agreed to paint this house by myself.": "Я думаю, я погризав більше, ніж міг, коли погодився намалювати цей будинок сам.",
  "I think I can do it quickly, but the exact schedule is still up in the air.": "Я думаю, я можу зробити це швидко, але точний графік все ще в повітрі.",
  "I think I will ignore the problem for the time being.": "Я думаю, що поки що я ігнорую цю проблему.",
  "I think Shane is going to move on my ex tonight.": "Думаю, Шейн перейде на мою колишню сьогодні.",
  "I think my sewing machine has kicked the bucket.": "Я думаю, що моя швейна машина підкинула ведро.",
  "I think someone put him up to it.": "Я думаю, хтось змусив його це зробити.",
  "I think that cat was looking to bite me if I hadn't run away!": "Думаю, ця кішка хотіла мене укусити, якби я не втекла!",
  "I thought I'd try my hand at woodworking, until I saw how much the tools cost.": "Я подумав, що спробую влаштувати дерево, поки не побачу, скільки коштують інструменти.",
  "I thought he was only going to buy the basic kit, but he bought the full monty.": "Я думав, що він купив лише базовий комплект, але він купив повний.",
  "I took a happy snap of the class standing in front of the museum.": "Я зняв щасливу фотографію класу, що стояла перед музеєм.",
  "I took my dog to the vet because he had poop water.": "Я відвів свою собаку до ветеринара, тому що у нього була кака-вода.",
  "I tried reading the instructions, but it’s all Greek to me.": "Я спробував прочитати інструкцію, але для мене це все грецьке.",
  "I tried to get Michele's attention at the party, but she looked right through me!": "Я намагався привернути увагу Мішелі на вечірці, але вона дивилася прямо через мене!",
  "I tried to help, but they turned up their noses at my advice.": "Я спробував допомогти, але вони підкинули нос на мою пораду.",
  "I want to make sure we're all on the same page with the game plan for the Acme account.": "Я хочу переконатися, що ми всі на одній сторінці з планом гри для рахунку Acme.",
  "I wanted to say grace before dinner, but the kids were already digging in.": "Я хотів сказати милосердство перед обідом, але діти вже копалися.",
  "I was about to sue them, but I had to back down.": "Я збирався затягнути їх, але мені довелося відступити.",
  "I was in the garden covered with mud when my grandmother dropped in for a visit.": "Я був у саді, покритому грязью, коли бабуся прийшла на візит.",
  "I was unable to put down The Stand: it was that exciting.": "Я не зміг залишити \"Станд\": це було так захоплююче.",
  "I watched him closely from the get-go because I did not trust him.": "Я спостерігала за ним з самого початку, тому що не довіряла йому.",
  "I will put out feelers and see what I can find out about that.": "Я викладу сенсори і побачу, що можу дізнатися про це.",
  "I wish the kids would get along better.": "Я б хотіла, щоб діти ладились краще.",
  "I woke up this morning with so much eye gunk on my face.": "Я прокинувся сьогодні з великою кількістю глаз на обличчі.",
  "I would just like to point out that we need to finish our meeting by 9 o'clock.": "Я хотів би лише зазначити, що ми повинні завершити нашу зустріч до 9 годин.",
  "I wouldn't pay one red cent for a ticket.": "Я б не заплатила ні одного червоного цента за квиток.",
  "I wouldn't trade you away for all the tea in China.": "Я б не обмінував тебе за весь чай в Китаї.",
  "I'd like to come, but the thing is, I just can't afford it.": "Я хотів би прийти, але справа в тому, що я просто не можу собі це дозволити.",
  "I'd like to help clear the field, but my knee went out on me.": "Я хотів би допомогти очистити поле, але мені випало коліно.",
  "I'd like to introduce Mumbo the Magnificent and his dancing parrot, Tiddles. Take it away, Mumbo!": "Я хотів би познайомитися з Мамбо Великолепним і його танцюючим попугайком, Тиддлсом.",
  "I'll be right back. I just need a little hair of the dog that bit me.": "Мені потрібен лише волосся собаки, яка мене укусила.",
  "I'll get the door. Someone's knocking to be let in.": "Я відкрию двері, хтось стукає, щоб впустити.",
  "I'll have to sit in with the interviews for the deputy manager position.": "Мені доведеться займатися інтерв'ю на посаду заступника менеджера.",
  "I'll just knock up a quick demo for the sales presentation.": "Я просто зроблю швидку демонстрацію для презентації продажів.",
  "I'll run you up a skirt for tomorrow evening.": "Я підведу тобі піску на завтра ввечері.",
  "I'll take on the project if no one else will.": "Я займуся проектом, якщо ще ніхто не буде.",
  "I'm about ready to turn into a pumpkin. You can stay up later if you want.": "Я готовий перетворитися на кукурузу.",
  "I'm afraid his personality doesn't sit with the rest of the team.": "Я боюся, що його особистість не відповідає решту команди.",
  "I'm getting kind of tired. Could we finish tomorrow?": "Я трохи втомився. Можемо закінчити завтра?",
  "I'm going to bail out of stocks and buy gold instead.": "Я збираюся викупити акції і купити золото замість цього.",
  "I'm going to do up the living room next.": "Я збираюся підготувати вітальню.",
  "I'm going to pass this exam if it kills me!": "Я пройду цей іспит, якщо це мене вб'є!",
  "I'm going to stay home Saturday and take it easy.": "Я залишимусь в суботу вдома і полегшуюся.",
  "I'm gonna lay into that ice cream later tonight.": "Я ляжу в цей морозиво пізніше сьогодні ввечері.",
  "I'm having problems getting over a bad cold.": "У мене проблеми з переходом на простуду.",
  "I'm holding on to my trump cards until I really need them.": "Я тримаю свої триумфальні картки, поки вони не будуть мені дуже потрібні.",
  "I'm not happy about the friends my son is running around with at the moment.": "Я не задоволений друзями, з якими мій син зараз ходить.",
  "I'm pulling up to the club tonight, want to join?": "Я збираюся до клубу сьогодні ввечері. Хочеш приєднатися?",
  "I'm ready to skydive twenty-four seven. [⁠nonliteral, hyperbolic⁠]": "Я готовий підскочити з параскопа 247.",
  "I'm sorry, I didn't hear you. Please say again?": "Вибачте, я вас не чув.",
  "I'm telling you, if you sign that paper, you're playing with fire.": "Я кажу тобі, якщо ти підпишеш цю паперу, ти граєш з вогнем.",
  "I'm tired, so I think I'll turn in early tonight.": "Я втомився, тому думаю, я повернуся раніше сьогодні.",
  "I'm too tired to go out tonight, but there again it might wake me up.": "Я занадто втомився, щоб вийти сьогодні, але це знову може розбудити мене.",
  "I'm trying to get over my fear of flying.": "Я намагаюся подолати свій страх літати.",
  "I'm waiting on you before we can leave.": "Я чекаю на тебе, перш ніж ми зможемо піти.",
  "I'm writing an article on spec. I hope some magazine will buy it.": "Я пишу статтю про специфіку. Я сподіваюся, що якийсь журнал купить його.",
  "I've been running about all week getting everything ready for the holidays.": "Я весь тиждень працював, щоб підготувати все на свята.",
  "I've been spinning my wheels on this problem all week, with nothing to show for it.": "Я весь тиждень займався цією проблемою, і нічого не показав.",
  "I've done it wrong, and what's more, I don't care.": "Я зробив це неправильно, і що ще більше, мені все одно.",
  "I've got a form that is to be filled in in ink.": "У мене є форма, яку потрібно заповнити чернилою.",
  "I've got about an hour in which to bash something out for the morning edition.": "Я маю близько години, щоб випустити щось для раннього видання.",
  "I've had the blues ever since my sweetheart left.": "У мене були блюзи з тих пір, як пішов мій кохань.",
  "If I had been more on the ball I would have asked when he called me.": "Якби я більше займався м'ячем, я б запитав, коли він мені подзвонив.",
  "If I tell you, you have to promise to keep shtum about it.": "Якщо я тобі скажу, ти маєш обіцяти, що не будеш говорити про це.",
  "If he doesn't win the next round, then his goose is cooked.": "Якщо він не виграє наступного раунду, то його гуса готується.",
  "If he offers a very high price, see if you can talk him down before you agree to anything.": "Якщо він пропонує дуже високу ціну, подивіться, чи зможете ви розмовити його, перш ніж погодитися на щось.",
  "If his performance does not improve very soon, his days at this company are numbered.": "Якщо його продуктивність не покращиться дуже скоро, його дні в цій компанії підлічені.",
  "If someone gets a promotion that might not be deserved, it could open up a whole can of worms with the other employees.": "Якщо хтось отримає підвищення, яке не заслуговує, це може відкрити цілу банку червей з іншими співробітниками.",
  "If their restaurant can't get business even on Mother's Day, it might be time for them to throw in the towel.": "Якщо у їхньому ресторані навіть в День матері не може бути бізнесу, можливо, прийшов час для них кинути рушницю.",
  "If they ask for something we didn't prepare, we will have to play it by ear.": "Якщо вони попросять чогось, чого ми не підготували, ми повинні буде грати це за вухом.",
  "If we can get the entire thing moved over in a day, it'll be a hole in one with the customer.": "Якщо ми зможемо перевезти всю справу за один день, це буде дупка в одному з клієнтом.",
  "If we're gonna make it by sunset, we'd better hit the road.": "Якщо ми збираємося до заходу сонця, нам краще піти на дорогу.",
  "If you are buying a new car, you might want to look into getting a hybrid or other high-efficiency vehicle.": "Якщо ви купуєте нову машину, то, можливо, захочете купити гібридну або іншу високоефективну машину.",
  "If you are careful to keep tabs on your finances, you should be able to stay within a budget.": "Якщо ви стежити за своїми фінансами, то повинні бути в змозі дотримуватися бюджету.",
  "If you can wait a couple of minutes, I'll run you back.": "Якщо ви можете почекати пару хвилин, я поверню вас.",
  "If you could carry that bucket of water over here, that'd be a good lick.": "Якщо б ви могли тут носити те ведро з водою, це було б добре лізати.",
  "If you decide to go through with the surgery, remember to leave time to recover.": "Якщо ви вирішите пройти операцію, пам'ятайте, що ви повинні дати час для відновлення.",
  "If you had set up automatic backups, you would have been able to recover your files, but as it is, you're out of luck.": "Якби ви встановили автоматичні резервні копії, ви могли б відновити свої файли, але зараз вам не пощастило.",
  "If you hang around after the show, you can meet the cast.": "Якщо ви прогуляєтеся після шоу, ви зможете зустрітися з виконавцями.",
  "If you hit me, I’ll hit you back; tit for tat.": "Якщо ти удариш мене, я тебе віддам, тід за тід.",
  "If you know anything about this, maybe you can fill me in.": "Якщо ти щось про це знаєш, ти можеш мені розповісти.",
  "If you look up a bunch of random characters, there will probably be no results.": "Якщо ви подивитеся на кучу випадкових персонажів, то, ймовірно, немає результатів.",
  "If you read between the lines a little, you will realize that he has deeper motives.": "Якщо ти трохи прочитаєш між строками, то зрозумієш, що він має глибші мотиви.",
  "If you start work on the new assignment now, you'll be ahead of the game for when the teacher sets it officially.": "Якщо ви почнете працювати над новим завданням зараз, ви будете напередодні до гри, коли вчитель офіційно встановить його.",
  "If you take the next left, you’ll see a big shop and hey presto, you’re there.": "Якщо ви займете наступну ліву, ви побачите великий магазин і привіт presto, ви там.",
  "If you think you're going to marry my daughter, you have another think coming.": "Якщо ви думаєте, що ви одружитесь за мою доньку, то подумайте ще раз.",
  "If you're lucky, she might give you the time of day.": "Якщо тобі пощастить, вона може дати тобі час дня.",
  "If you’re stuck in traffic, try not to make a mountain out of a molehill worrying about it too much. You could be making it much worse.": "Якщо ви застрягли в дорозі, намагайтеся не перетворити гору на молеву, переживаючи про це занадто багато.",
  "In our lectures we need to get over the importance of online safety.": "У наших лекціях ми повинні переглянути важливість безпеки в Інтернеті.",
  "In the dark he came across an old box by accident.": "У темряві він випадково наткнувся на стару скриньку.",
  "In the dark, the teddy bear took on the appearance of a fearsome monster.": "У темряві медведь з'явився як страшний монстр.",
  "Including a few fun details in large group introductions can be a great way to break the ice.": "Включення кількох цікавих деталей у представлення великих груп може бути відмінним способом розбити лід.",
  "Is Mary up to speed on the situation in Kuala Lumpur?": "Мері добре знає про ситуацію в Куала-Лумпурі?",
  "Is it worth taking it to a repair shop, or should I just break down and buy a new one?": "Чи варто відвезти його до ремонтної майстерні, або я просто розкладу і куплю новий?",
  "It created a disruption, and then some.": "Це викликало порушення, а потім деякі.",
  "It is 15 kilometers as the crow flies.": "Це 15 кілометрів, коли вівко літає.",
  "It is a shame: his first day driving and he falls asleep at the wheel.": "Шкода: його перший день на воді і він заспиває за кермом.",
  "It is an old tradition carried through into the information age.": "Це стара традиція, що переведена до інформаційного віку.",
  "It is still a bone of contention whether to go ahead with the original plan in light of the new evidence.": "З огляду на нові докази все ще є питання про те, чи слід продовжувати оригінальний план.",
  "It really gets my goat when inconsiderate people drop litter in public.": "Мені дуже страшно, коли неосвічені люди кидають сміття на публіці.",
  "It really sticks in my craw that he never even asked me.": "Він навіть не запитав мене.",
  "It says here not to drive with the sun shade covering the windshield of your car. No duh!": "Тут сказано не їздити з сонячним відтінком, що покриває вітрове стекло автомобіля.",
  "It seems like it’s been a month of Sundays since we saw him last.": "Здається, що це був місяць неділок з тих пір, як ми його побачили.",
  "It started raining on their picnic and they had to move the whole shooting match inside.": "На пікніку почався дощ і їм довелося перенести весь матч.",
  "It took you a long time to fetch that tool! Did you take the scenic route?": "Вам знадобилося багато часу, щоб привезти цей інструмент!",
  "It turns out that he just made a lucky guess.": "Виявляється, він просто зробив щасливе здагадку.",
  "It used to be a funny comic, but lately it has gone off the deep end.": "Раніше це був смішний комікс, але останнім часом він зник з глубинки.",
  "It was an unfortunate slip of the tongue, and he did not intend it that way.": "Це був нещасний сліз мови, і він не мав намір так.",
  "It was going to be a surprise party until someone let the cat out of the bag.": "Це була сюрпризна вечірка, поки хтось не випустив кішку з сумки.",
  "It was the end of term and students decided to celebrate by painting the town red.": "Це був кінець семестру і студенти вирішили святкувати, намалюючи місто червоним.",
  "It was, by and large, an unexceptional presentation.": "Це було, як правило, незвичайна презентація.",
  "It'll be a cold day in hell when that happens.": "Буде холодний день в пеклі, коли це станеться.",
  "It's a straightforward job, but it's no bed of roses, with such long hours.": "Це проста робота, але це не ліжко з розами, з такими довгими робочими часами.",
  "It's all go around here: Jo's about to get married, and Dave has a new job.": "Джо збирається одружитися, а Дейв має нову роботу.",
  "It's apples and oranges. You can't convert square meters to linear inches.": "Це яблуки і апельсини. Не можна перетворити квадратні метри на лінійні дюйма.",
  "It's colder than a bygod out there!": "Там холодніше, ніж там бог!",
  "It's no use trying to push the car out of the ditch; the axle is broken.": "Немає сенсу намагатися виштовхнути машину з рота; осі зламана.",
  "It's still too complicated for me to understand. Can you give me the 'for dummies' version?": "Це все ще занадто складно для мене зрозуміти.",
  "It's supposed to be a surprise, so try to keep a lid on it, will you?": "Це має бути сюрприз, так що спробуй приховати, добре?",
  "It's time to batten down the hatches and prepare for the coming challenge.": "Прийшов час забити люки і підготуватися до майбутнього виклику.",
  "It's warm today, so you can probably get away with just wearing a short-sleeved shirt.": "Сьогодні тепличе, тому ви, ймовірно, зможете вийти з цього, просто одягнувши короткоручну сорочку.",
  "It's your turn to give a pep talk to the dispirited miners.": "Це твоя черга підбадьорювати розчарованих шахтерів.",
  "I’ll be gone for a few days, but I hope you will carry on in my absence.": "Я піду на кілька днів, але я сподіваюся, що ви продовжите в моїй відсутності.",
  "I’ll be sending a pinch hitter to do the presentation because I have the flu.": "Я пошлю на презентацію хіттера, тому що у мене грип.",
  "I’m going to get into work on time today. — That’ll be the day!": "Я збираюся піти на роботу на час сьогодні.",
  "I’ve never met someone so incompetent. He’s only fit for the knacker’s yard.": "Я ніколи не зустрічав такого некомпетентного.",
  "James thought it was cruel for the fraternity members to make the pledge think his father had died suddenly and refused to play along.": "Джеймс вважав жорстоким для членів братерства, щоб заклятий думав, що його батько раптово помер, і відмовився грати разом з ним.",
  "Jane talked back a little too often.": "Джейн занадто часто відмовлялася.",
  "Jarn hasn't seen Schnie in a coon's age.": "Джарн не бачив Шні в юношньому віці.",
  "Joe Bloggs became president – need I say more?": "Джо Блоггс став президентом.",
  "John Higgins, I haven't seen you in a dog's age.": "Джон Гігінс, я не бачив тебе у собачий вік.",
  "John has just notched up another \"salesman of the month\" prize.": "Джон отримав ще одну нагороду \"продавець місяця\".",
  "John stood Laura up at the movie theater.": "Джон підняв Лору в кінотеатрі.",
  "John's been on at me to donate to his crowdfunder.": "Джон забирав мене, щоб пожертвувати на свого краудфандера.",
  "John's youngest is doing well at school. He's a bright spark, isn't he?": "Наймолодший Джон добре навчається в школі. Він яскрава искра, чи не так?",
  "Just hang on and keep going; this pain won't last forever.": "Просто тримайся і продовжуй, ця біль не триватиме вічно.",
  "Just lay off, okay! I've had enough!": "Просто перестань, добре!",
  "Just punch in the numbers and it will give you an estimate of the cost.": "Просто натисніть цифри, і це дасть вам оцінку вартості.",
  "Just stop beating around the bush and tell me what the problem is!": "Просто перестань бігати навколо куста і скажи мені, в чому проблема!",
  "Just throw that pen out if it doesn't write anymore.": "Просто викинь цю ручку, якщо вона більше не пише.",
  "Keep an eye peeled, you never know when the ice-cream truck will pass by.": "Подивіться, ніколи не знаєш, коли пройде вагон з морозивами.",
  "Keep on trucking!": "Продовжуйте перевезення!",
  "Keep up the good work, team!": "Продовжуйте добру роботу, команда!",
  "Lay off the singing, will you! I'm trying to study.": "Перестань співати, я намагаюся вчитися.",
  "Leaving your wallet visible on the car seat is just asking for it.": "Оставляючи свій кошелек видимим на сиденні автомобіля, це просто просить його.",
  "Left to my own devices, I'll spend hours staring into space, just thinking.": "Покінчившись на власні засоби, я проводжу години, дивлячись у космос, просто думаючи.",
  "Let me get on the horn with him and ask.": "Позвольте мені піти з ним на рог і запитати.",
  "Let me read this part of the note for the court reporter: \"Either meet my demands or dot dot dot.\"": "Дозвольте мені прочитати цю частину записку для репортера суду: \"або задовольняйте мої вимоги, або точка точка\".",
  "Let me run through today's meeting for those who missed it.": "Дозвольте мені переглянути сьогоднішнє засідання для тих, хто його пропустив.",
  "Let me see if I can light a fire under the waiter to get our order sooner.": "Подивися, чи можу я запалити вогонь під офіцером, щоб отримати наш заказ раніше.",
  "Let me throw this out there – how about if we make the igloo out of butter? Would that work?": "Дайте, я викину це. Як насчет того, щоб зробити іглу з масла?",
  "Let the new hire do that project so she can get her feet wet.": "Позвольте новому найматому зробити цей проект, щоб вона змогла омокнути ноги.",
  "Let's go, practice starts in five minutes.": "Пойдіть, тренування починається через п'ять хвилин.",
  "Let's try to hold off the lawyers until we are ready for them.": "Давайте спробуємо затримати адвокатів, поки ми не будемо готові до них.",
  "Let's turn that around and look at it from another angle.": "Давайте повернемо це і подивимося на це з іншого кута.",
  "Let’s just say I know because a little bird told me.": "Скажімо, я знаю, тому що маленька пташка сказала мені.",
  "Little Miss Smartyboots is too clever by half.": "Маленька міс Смартбоутс занадто розумна на половину.",
  "Long long ago, in a land far far away there lived a beautiful princess.": "Дуже давно, в далекій країні жила прекрасна принцеса.",
  "Look at the city slicker pulling up in his fancy German car.": "Подивіться, як міський згубник зупиняється у своїй гарної німецькій машині.",
  "Look at the gluteus maximus on that woman!": "Подивіться на глютеус максимус цієї жінки!",
  "Look at the urban dweller pulling up in his fancy German car.": "Подивіться на міського жителя, який зупиняється у своїй гарному німецькому автомобілі.",
  "Make just one move, and I'll run you through, sir, without hesitation.": "Зробіть лише один крок, і я переверну вас, пане, без сумнівів.",
  "Make sure none of your men go off half-cocked and ruin this operation.": "Переконайся, що ніхто з твоїх людей не піде на половину і не зруйнує цю операцію.",
  "Management kept the board of directors completely in the dark.": "Керівництво тримало правління повністю в темряві.",
  "Many football, basketball, and hockey players, boxers, wrestlers, cage fighters, hunters, bikers, NASCAR drivers, matadors, and rodeo cowboys are adrenaline junkies.": "Багато гравців у футбол, баскетбол та хокей, боксерів, борців, борців за клітки, мисливців, велосипедистів, водіїв NASCAR, матадорів і ковбоїв на родео - це адереналінові наркомани.",
  "Many videos come with features that show what went on behind the scenes to make the movie and special effects.": "У багатьох відео з'являються особливості, які показують те, що відбувалося за кулісами, щоб зробити фільм і спеціальні ефекти.",
  "Monday was a red letter day for her. She accomplished a lot and had fun doing it.": "У понеділок для неї був день червоного листа. Вона багато досягла і весело це робила.",
  "More often than not, tomato seeds will sprout even if they are a couple of years old.": "Найчастіше семена томатів розрастають навіть якщо їм пару років.",
  "Most of us didn't plan to be designers; we just fell into the job.": "Більшість з нас не планувало бути дизайнерами, ми просто потрапили в цю роботу.",
  "My Nigel says there was no brandy cream in the supermarket, but I think he only had a man look.": "Мій Найджл каже, що в супермаркеті не було крем з бренді, але я думаю, що він виглядав як чоловік.",
  "My arm is still black and blue from slipping on the ice yesterday.": "Моя рука все ще чорно-синя, тому що вчора прослізнула на льоду.",
  "My boss didn't tell me to reorganize the filing system; I did it off my own bat.": "Мій начальник не сказав мені реорганізувати систему реєстрації; я зробив це самостійно.",
  "My boss expected us to say yes and amen to his cockamamie plans.": "Мій босс очікував, що ми скажемо \"так\" і \"амен\" його планам.",
  "My boss is so clueless, he couldn't schedule his own way out of a paper bag.": "Мій начальник так безглуздь, що не міг собі запланувати вихід з паперової сумки.",
  "My boss spilled water all over my keyboard today. On the plus side, it's much cleaner now.": "Сьогодні мій начальник пролив воду на мою клавіатуру.",
  "My bus pass is out of date — I'll have to go buy a new one.": "Мій автобусний квиток застарілий  ⁇  Я повинен піти купити новий.",
  "My cousin got off lightly with a restraining order after he broke the boy’s leg.": "Мій двоюрідний брат легко вийшов з заборони після того, як він зламав ногу хлопчика.",
  "My dad flew off the handle when he saw the F grade on my report card.": "Мій батько злетів з ручки, коли побачив на моїй карті F-клас.",
  "My dad is such an armchair quarterback; he recognizes every bad decision the coach makes as soon as the play is over and he knows whether or not it worked.": "Мій батько - такий квотербек на стільці; він розпізнає кожне погане рішення, яке робить тренер, як тільки закінчиться гра і він знає, що це спрацювало чи ні.",
  "My daughter likes to hang around with older kids after school.": "Моя дочка любить проводити час з старшими дітьми після школи.",
  "My musical tastes don't run to Wagner, I'm afraid.": "Я боюся, що мої музичні смаки не схожі на Вагнера.",
  "My old backpack finally bit the dust the other day.": "Мій старий рюкзак, нарешті, в другий день погризав прах.",
  "My old computer finally gave up the ghost the other day.": "Мій старий комп'ютер останнім часом відмовився від призраку.",
  "My performance seems somehow always to get worse when there are other people looking on.": "Мені здається, що мій виступ завжди погіршується, коли спостерігають інші люди.",
  "My pookie bear, how was the flight?": "Мій медведь, як був рейс?",
  "My taxes did not increase because the amount of my raise was set off by my losses in the stock market.": "Мої податки не збільшилися, тому що сума мого підвищення була відстрочена моїми втратами на фондовому ринку.",
  "My uncle was a truckdriver. He drove truck for Roadway for years.": "Мій дядько був водієм вантажівки.",
  "My wife is unavailable for three months, as she's doing time for fraud.": "Моя дружина три місяці недоступна, тому що вона висунулася за шахрайство.",
  "New figures are in. We need to turn these round ASAP: the boss wants a report tonight.": "Ми повинні скористатися цим якнайшвидше, бос хоче доповіді сьогодні.",
  "Nine different countries have the atomic bomb as of 2022.": "Девять різних країн мають атомну бомбу з 2022 року.",
  "No use crying over spilt milk.": "Немає сенсу плакати за розлитим молоком.",
  "No wonder I couldn’t find it—it was out of place.": "Не дивно, що я не знайшов, що він не на місці.",
  "No, the original plan for Chicago's street layout was not scribbled on the back of a napkin by an ancestor of Roger Ebert; you just ate the onion.": "Ні, оригінальний план планування вулиць Чикаго не був написан на задній частині салфетки предком Роджера Еберта; ви просто з'їли лук.",
  "Nobody thought they'd win, but the football team pulled out a victory.": "Ніхто не думав, що вони виграють, але футбольна команда одержала перемогу.",
  "Nose to the grindstone, he was up all night.": "Він був всю ніч не спав.",
  "Not even thirty minutes after leaving the shower, my head starts itching. What gives?": "Навіть через тридцять хвилин після того, як я вийшла з душа, моя голова починає сверднути.",
  "Not only did the Dublin barkeeps not make a shamrock in the foam, they claimed to not even know what a black and tan was.": "Дублинські бармани не тільки не робили шамрока в пені, але й стверджували, що навіть не знають, що таке чорно-коричневі.",
  "Nothing went well in high school, so he dropped out.": "У середній школі нічого не вийшло добре, тому він закінчив школу.",
  "Now that word-processing has caught on, typewriters have gone the way of the dodo.": "Тепер, коли переробка слів поширилася, друкарські машини пішли шляхом додо.",
  "Oh, boy! I can't wait to tell my friends about this!": "Я не можу дочекатися, коли скажу про це своїм друзям!",
  "Oh, for crying out loud, get off the computer! You've been on there for ages!": "О, за те, що ти кричиш, скинься з комп'ютера!",
  "Oh, it's on now, for sure. Those boys are about to get smoked real good.": "О, зараз, звичайно, ці хлопці збираються дуже добре викурити.",
  "Oh, yeah? Well, don't look now, but we're on the grass!": "Не дивлячись, але ми на траві!",
  "On my first day at work, the secretary walked me through the process of using the photocopier.": "У перший день, коли я працював, секретар показав мені, як використовувати фотокопіючу машину.",
  "Once that bank gets its claws into you, it doesn't let go easily.": "Як тільки цей банк втягне свої кіли в вас, він не відпускає вас легко.",
  "Only the top banana can make a decision of that magnitude.": "Тільки верхній банан може прийняти таке рішення.",
  "Oops, I just made another typo with my sausage fingers!": "Упс, я зробив ще одну помилку з пальцями!",
  "Our double play special tonight is scallops & crab.": "Наше двойне ігрове спеціальності сьогодні - \"Скалопс і краб\".",
  "Our new foil packets keep the flavour of the crisps locked in.": "Наші нові пакети фолії зберігають смак чипсів.",
  "Out in the backwoods with only a tent and no radio or plumbing, they were really roughing it.": "В лісах, де було лише палатка, і без радіо або водопроводу, вони дуже згубилися.",
  "Over the weekend he spent some time getting rid of the clothes he no longer wears.": "В вихідні він витратив час на те, щоб позбутися одягу, який він більше не носить.",
  "People who are down and out need some place to turn.": "Людям, які звалилися і виходили, потрібне місце, де повернутися.",
  "People with your skills are a dime a dozen these days.": "Люди з твоїми навичками - це дюжина доларів в наші дні.",
  "People with your skills are ten a penny these days.": "Люди з твоїми навичками сьогодні коштують десять гривень.",
  "Perhaps we should step back for a second and think about solving this problem a different way.": "Можливо, ми повинні на секунду відступити і подумати про вирішення цієї проблеми іншим способом.",
  "Pinkett is angry that George betrayed his trust and took him for $100K.": "Пінкет злився, що Джордж зрадив його довіру і взяв його за 100 тисяч доларів.",
  "Playing a radio in the office did not go over well with his coworkers.": "Колегам не сподобалося, що він увімкнув радіо в офісі.",
  "Please come on time; don't just show up whenever you feel like it.": "Будь ласка, приходь вчасно, а не коли заманеться.",
  "Please give all of the fantastic performers a big round of applause for their efforts this evening!": "Бурхливі оплески всім чудовим артистам за їхній сьогоднішній виступ!",
  "Please go over the reports to make sure we haven't missed anything.": "Будь ласка, перегляньте звіти, щоб переконатися, що ми нічого не пропустили.",
  "Please hold the line a moment while I put you through to the sales office.": "Зачекайте хвилинку на лінії, я з’єднаю вас із відділом продажу.",
  "Please hold the noise down.": "Будь ласка, не галасуйте.",
  "Please move your bike out of the way.": "Будь ласка, переставте велосипед, щоб він не заважав.",
  "Please run off a couple dozen more flyers to pass out.": "Будь ласка, надрукуйте ще кілька десятків листівок, щоб їх роздати.",
  "Please scoot over a little so I can sit down.": "Посунься трохи, будь ласка, щоб я міг сісти.",
  "Please stand by for more instructions.": "Будь ласка, зачекайте на подальші вказівки.",
  "Pop music comes and goes, but classical music has stood the test of time.": "Попмузика приходить і відходить, а класична музика витримала випробування часом.",
  "Publishing those photos of the car crash was messed up.": "Публікувати ті фото з аварії було недоречно.",
  "Pull the car up a little so you don't block his driveway.": "Під’їдь трохи вперед, щоб не перекривати йому в’їзд.",
  "Pull up a chair and sit down.": "Присунь стілець і сідай.",
  "Pull up that website for me; it sounds quite interesting.": "Відкрий мені той сайт. Звучить доволі цікаво.",
  "Pull up to that curb slowly; you don't want to scratch that other car.": "Повільно під’їжджай до бордюру, щоб не подряпати іншу машину.",
  "Put me down for one of the drivers.": "Запишіть мене в список водіїв.",
  "Quick! The train's pulling in.": "Швидше! Потяг уже під’їжджає до платформи.",
  "Sara was never the same after losing her daughter, the apple of her eye.": "Сара вже ніколи не була такою, як раніше, після того як втратила доньку, яку обожнювала.",
  "Schumacher is beginning to pull away from the rest of the racers.": "Шумахер починає відриватися від решти гонщиків.",
  "See if you can make head or tail of the last section in this chapter. I'm baffled.": "Подивіться, чи зможете ви згадати останній розділ цієї глави.",
  "See? Nothing to it. You just put tab A in slot B and give it a flip.": "Ви бачите? Нічого, просто покладіть закладку \"А\" в ділянку \"Б\" і переверніть її.",
  "Shake a leg! We haven't got all day.": "У нас немає всього дня.",
  "Shakespeare could run off a play in just a couple of days.": "Шекспір може закінчити п'єсу за пару днів.",
  "She came a cropper on the stairs and broke her leg.": "Вона прийшла на сходу і зламала ногу.",
  "She came to with the aid of smelling salts.": "Вона з'явилася за допомогою запаху солей.",
  "She didn’t have a lot of money, but she had enough to get along.": "У неї не було багато грошей, але вона мала достатньо, щоб жити разом.",
  "She finally came out of the closet to her religious family regarding her atheism.": "Вона, нарешті, вийшла з гардероба до своєї релігійної сім'ї щодо свого атеїзму.",
  "She finally carried out her lifelong ambition when she appeared in a Hollywood blockbuster.": "Вона, нарешті, здійснила свою життєву амбіцію, коли з'явилася в голівудському блокбастері.",
  "She has the entire crew under her thumb. They would do anything for her.": "Вона має всю команду під своїм контролем.",
  "She kept up her diet for an entire month before falling off the wagon.": "Вона тривала на дієті цілий місяць, перш ніж випала з вагона.",
  "She left the restaurant with him hot on her heels.": "Вона вийшла з ресторану з ним гарячим на кабінках.",
  "She put her long life down to daily meditation.": "Вона поклала свій довгий життя на щоденну медитацію.",
  "She put toothpaste in his shoes to get back at him for the frog he left in her refrigerator.": "Вона помістила зубну пасту в його взуття, щоб помститися за жабу, яку він залишив у холодильнику.",
  "She ran on and wouldn't let anyone get a word in edgeways.": "Вона йшла і не дозволяла нікому говорити.",
  "She really went to town with the party preparations.": "Вона дійсно поїхала в місто з підготовкою до вечірки.",
  "She stayed late, working like crazy to get the project done before the deadline.": "Вона залишилася пізно, працюючи, як божевільний, щоб зробити проект до крайнього терміну.",
  "She tried to do away with the argument by changing the topic.": "Вона намагалася позбутися аргументу, змінивши тему.",
  "She was all keyed up about the interview.": "Вона була запрямлена про інтерв'ю.",
  "She was at a loss for words when she saw the number of people who had come to grieve for her husband.": "Вона втратила слова, коли побачила кількість людей, які прийшли оплакувати чоловіка.",
  "She was determined to win the contract by hook or by crook.": "Вона була рішуча, щоб виграти контракт за кукусом або підступником.",
  "She was head and shoulders better than any of her rivals.": "Вона була головою і плечами краще, ніж будь-який з її суперників.",
  "She was in love with me for 10 years, and still hasn't got over the fact that the feeling wasn't mutual.": "Вона закохалася в мене 10 років, і все ще не пережила той факт, що почуття не було взаємним.",
  "She was pulled in for questioning.": "Її притягнули до допиту.",
  "She's been keeping me at arm's length all the time. She doesn't want to get involved.": "Вона постійно тримає мене на відстані, вона не хоче втручатися.",
  "She's good enough at fixing vacuum cleaners that she should hang out her shingle and try making some money at it.": "Вона досить добра в ремонті стиральних машин, що вона повинна вивесити свій шінгль і спробувати заробити гроші з нього.",
  "She's normally a quiet person, but she will talk a blue streak about fashion, if you let her.": "Зазвичай вона спокійна людина, але вона буде говорити про моду, якщо ти дозволиш їй.",
  "Should I turn off this light or keep it on?": "Я повинен погасити світло чи тримати його включеним?",
  "Since when do I need your permission?": "Звідки мені потрібна ваша дозвола?",
  "Six years of a happy relationship, and then she had the nerve to cheat on me with a barman!": "Шість років щасливих стосунків, а потім їй довелося обдурити мене барменом!",
  "Sleep tight […] don’t let the bedbugs bite!": "Сніть наполегливо... не дозволяйте жукам кусатися!",
  "Smith is good at detail, but can't see the forest for the trees.": "Сміт кращий у деталях, але не може побачити ліс за деревами.",
  "So Johnny has finally learned the alphabet - it's about time too, he's 6!": "Отже, Джонні, нарешті, навчився алфавіту - і вже час, йому 6 років!",
  "So he walks in, calm as you like, and demands all the money from the till.": "Тож він входить, спокійний, як ти хочеш, і вимагає всіх грошей з кашони.",
  "So the CEO of ScamCo is going to prison? Couldn't happen to a nicer guy.": "Так генеральний директор ScamCo піде у в'язницю?",
  "Some children are born out of wedlock.": "Деякі діти народжуються поза шлюбом.",
  "Some ice cold lemonade would hit the spot on a warm afternoon.": "На теплий вечір трапилася холодна лимонадка.",
  "Somebody broke into his car and stole his tools and CDs.": "Хтось вламався в його машину і вкрав його інструменти і CD.",
  "Someday I'm going to clean up my act and start researching more carefully.": "Одного разу я очищу свою поведінку і почнему більш уважно досліджувати.",
  "Someone else needs to figure out the menu for the going-away party. I have bigger fish to fry.": "Хтось інший повинен вигадати меню для прощальної вечірки.",
  "Sorry to bend your ear with the whole story, but I think you ought to know.": "Вибачте, що викрив ваше вуха з усією історією, але я думаю, ви повинні знати.",
  "Sorry, but you'll just have to lump it.": "Вибачте, але вам просто доведеться скласти його.",
  "Speak loudly, because Grandpa is somewhat hard of hearing.": "Говоріть гучно, тому що дідусь трохи не чує.",
  "Stains really show up on this white tablecloth.": "На цьому білому столовому тканині дійсно з'являються плями.",
  "Stand quietly while the honor guard runs the flag up.": "Стоїть тихо, поки охоронник почесності піднімає прапор.",
  "Stick with me, kid, and you'll be farting through silk.": "Застань зі мною, хлопчик, і ти будеш пердити по шовку.",
  "Sure, he has a wife and kids, but that's not saying much when they're separated and he hasn't seen them in years.": "Звичайно, він має дружину і дітей, але це мало говорить, коли вони розділені і він не бачив їх багато років.",
  "Sure, no problem. It'll be a piece of cake.": "Звичайно, без проблем, це буде кусок торту.",
  "Take care when guessing, since problems do not always have cut-and-dried answers.": "Будьте обережні, коли гадаєте, оскільки на проблеми не завжди є чіткі відповіді.",
  "Talk about a loose cannon! Did you hear his TV speech?": "Ви чули його телевізійну промову?",
  "Talk to me like that again and I'll fill you in!": "Знов так розмовляй, і я тебе про це розповім!",
  "Teddybear says it's time to put away your toys and go night-night.": "Медведь каже, що пора скласти свої іграшки і піти ніч на ніч.",
  "Tell you what, you can have it for fifty quid if you'll promise to give it a good home.": "Ви можете отримати його за 50 фунтів, якщо обіцяєте дати йому хороший будинок.",
  "Terrain, terrain! Pull up! Pull up!": "Террен, террен, піднімайтесь!",
  "Thanks for your comments, I'll take them on.": "Дякую за ваші коментарі, я їх прийняв.",
  "Thanks! You guys take the cake.": "Хлопчики, візьміть торт.",
  "That beeping sound indicates that the truck is backing up.": "Цей біп-звук свідчить про те, що вантажівка відступає.",
  "That creep in the corner was eyeing me up.": "Цей придурок в кутку дивився на мене.",
  "That guy sure can hold a grudge when something goes wrong.": "Цей хлопець, звичайно, може зберігати злобу, коли щось піде не так.",
  "That guy was an idiot and a half.": "Цей хлопець був ідіотом і півтора.",
  "That idea makes no sense at all. – Speak for yourself! I think it's a great idea.": "Ця ідея зовсім не має сенсу.  ⁇  Говори за себе! Я думаю, це чудова ідея.",
  "That is the fourth time this week my neighbor's barking dog has woken me up. I'm going to go give her a piece of my mind about it.": "Це четвертий раз на цьому тижні, коли собака мого сусіда пробудила мене.",
  "That joke was crack up.": "Ця жартка була неправдивою.",
  "That last fighter put up quite a fight.": "Цей останній боїць дуже боровся.",
  "That late in the evening, he was three sheets to the wind and had long since stopped making sense.": "У той пізній вечір, він був три листочки до вітру і давно перестав мати сенс.",
  "That lottery money is both of theirs. They ought to share it.": "Ці гроші на лотерею є їх обох.",
  "That meal went down a treat.": "Цей обід був дуже приємним.",
  "That movie was both hilarious and touching; it was the best of both worlds.": "Цей фільм був як смішним, так і вражаючим; він був найкращим з обох світів.",
  "That project is on the back burner until we deal with higher priorities.": "Цей проект залишається на задній план, поки ми не вирішимо більш високих пріоритетів.",
  "That swindler did me out of £100.": "Цей мошенник викупив мені 100 фунтів.",
  "That will do for the nonce, but we'll need a better answer for the long term.": "Це буде достатньо для нонсе, але нам потрібен кращий відповідь на довгостроковий термін.",
  "That's a really screwed up car.": "Це дійсно зіпсована машина.",
  "That's all the news for now, but I'll keep you posted about new developments.": "Це всі новини на даний момент, але я буду тримати вас в курсе про нові події.",
  "That's just my tuppenceworth; you can believe what you like.": "Це просто моя річ, ти можеш повірити, що ти хочеш.",
  "That's just my two cents, you can believe what you like.": "Це лише мої два цента, віри, що ти хочеш.",
  "That's just my two penn’orth; you can believe what you like.": "Це лише мої два пісми, ти можеш повірити, що ти хочеш.",
  "That's what it's all about.": "Ось про це й йдеться.",
  "The 2006 St. Louis Cardinals backed into the playoffs.": "2006 року \"Сент-Луїс Кардиналі\" повернулися до плей-офф.",
  "The Brazilians are eating their hearts out over their defeat by Germany in the World Cup.": "Бразильці з'їдають свої серця через поразку перед Німеччиною у чемпіонаті світу.",
  "The Governor called out the National Guard.": "Губернатор викликав Національну гвардію.",
  "The Group Executive Committee couldn't run a whelk stall!": "Виконавчий комітет Групи не міг управляти вілк-столом!",
  "The abbreviation CIA stands for \"Central Intelligence Agency\".": "Кратке слово \"ЦРУ\" означає \"Центральна розвідкова агенція\".",
  "The actress carried off a difficult performance with dash.": "Актриса виконала складне виступлення з шахом.",
  "The audience hangs on his every word.": "Глядачі вісят за кожним його словом.",
  "The baby puked up all over my shirt.": "Дівчинка пов'язала мою сорочку.",
  "The bakery turns out three hundred pies each day.": "У пекарні щодня виходить триста пирог.",
  "The ball game is scheduled for Saturday, but we're still at the mercy of the weather.": "Матч запланований на суботу, але ми все ще на милості погоди.",
  "The band started up playing.": "Група почала грати.",
  "The battery lasts a day in my phone, but your mileage may vary.": "Батерія триває день у мому телефоні, але ваш кілометр може змінюватися.",
  "The best revenge is always to just happily move on and let karma do the rest.": "Найкраща помста завжди - просто щасливо перейти далі і дозволити кармі зробити решту.",
  "The board threw the man out, because he wouldn't cooperate and agree with their plans to remodernize the facility.": "Борд вигнав чоловіка, тому що він не хотів співпрацювати і погодитися з їхніми планами ремодернізувати об'єкт.",
  "The boss fired Fred and, to top it all off, he asked security to escort him to the door.": "Шеф звільнив Фреда і, щоб завершити все, він попросив охоронців супроводжувати його до дверей.",
  "The boss wants some new ideas—it's time to think outside the box.": "Шеф хоче нових ідей. Прийшов час подумати поза рамками.",
  "The bouncer shouted “Buzz off!” and kicked me out of the establishment.": "Виховувач крикнув \"Бузз!\" і викинув мене з закладу.",
  "The campaign staff cautioned the candidate to handle the issue with kid gloves.": "Співробітники кампанії попередили кандидата вирішити проблему з дитячими перчатками.",
  "The cardamom runs through the cake.": "Кардамон проходить через торт.",
  "The chairman sat on the report until the end of the legislative session.": "Голова сидів на доповіді до кінця законодавчої сесії.",
  "The chief accountant has run off with his secretary!": "Головний бухгалтер збег зі своєю секретаркою!",
  "The city rebuilt in the wake of the earthquake.": "Місто відбудовано після землетрусу.",
  "The company barely lifted a finger, and yet it still raked in more than two million euros in consulting fees.": "Компанія ледь підняла палець, і все ж вона заробила понад два мільйони євро на консультантські збори.",
  "The con man plays his victims along until he senses the moment to ask for money.": "Мошенник відіграє жертви, поки не відчує нагоду попросити гроші.",
  "The cupbearers made quick work of the after-dinner cleanup chores.": "Копальники швидко виконували чистільні справи після обіду.",
  "The dam can't hold back that much water.": "Дама не може утримувати стільки води.",
  "The day is dollaring up to be rainy and dark.": "День стає дощним і темним.",
  "The decision comes down to whether you really want to pay that much for a little extra convenience.": "Рішення залежить від того, чи дійсно ви хочете заплатити стільки за трохи додаткового зручності.",
  "The decision won't be set in stone until we release the documents.": "Рішення не буде зроблено до тих пір, поки ми не випустимо документи.",
  "The dirt in the apparatus threw off the results.": "Грязь в апараті відкинула результати.",
  "The employees talked about their boss behind his back.": "Працівники говорили про свого начальника за його спиною.",
  "The essay attempts to play down the role slavery had in the Civil War.": "У есе спробується опустити роль рабства в громадянській війні.",
  "The figures are going to be in the red this year.": "Цього року ці дані будуть червоними.",
  "The first year after we bought the house, we lived on a shoestring, but we survived.": "Перший рік після того, як ми купили будинок, ми жили на шнурі, але вижили.",
  "The fix I made was just a penny in the fusebox; we need to revisit it and fix the problem for real.": "Я виправив це лише пенсі в беззахисному коробці; ми повинні знову переглянути його і вирішити проблему на решті.",
  "The food was expensive, and nothing out of the ordinary.": "Їжа була дорогою, і не було нічого незвичайного.",
  "The football team walked away with a 1-0 victory.": "Футбольна команда вийшла з перемогою 1:0.",
  "The garage was filled with a random assortment of odds and ends.": "Гараж був наповнений випадковим асортиментом шансів і кінців.",
  "The guy tried to hold up a bank.": "Чоловік намагався зупинити банк.",
  "The hospital staff often go above and beyond what is required of them.": "Шпітальні працівники часто роблять більше, ніж потрібно.",
  "The hotel staff hastened to turn out the noisy drunk.": "Хотельний персонал поспішав вивести шумного п'яного.",
  "The hotel we stayed in this year was fabulous. It put our vacation a notch above the rest.": "Готель, в якому ми зупинилися в цьому році, був чудовим. Він поставив наші відпустки вище інших.",
  "The ice cream shop teamed up with the cookie and brownie place next door to create wonderful sundaes.": "Магазин морозива поєднався з печеньем і пляшом побач, щоб створити чудові морозива.",
  "The investigator spent days trying to prove the butler committed the murder, but it turns out he was barking up the wrong tree.": "Розслідувач кілька днів намагався довести, що майстер вчинив вбивство, але виявилося, що він лав на неправильному дереві.",
  "The joggers pounded the pavement for several miles each day.": "Кожного дня тікачі бігали кілька кілометрів по тротуарах.",
  "The kids had a ball playing in the fountain.": "Діти грали в футбол у фонтані.",
  "The king called on his subjects to take up arms and defend the kingdom.": "Король закликав своїх підданих взяти зброю і захистити королівство.",
  "The landlady magicked up a large breakfast for us and our unexpected guest.": "Хозяїна приготувала великий сніданок для нас і нашого несподіванного гостя.",
  "The language was wrong for the period, but, on the whole, I enjoyed the film.": "У той час мова була неправильна, але в цілому фільм мені сподобався.",
  "The lifeguard pulled the man out of the lake and gave him the kiss of life.": "Спасач витягнув чоловіка з озера і дав йому поцілу життя.",
  "The mayor of the little town rolled out the red carpet for new businesses by calling on them personally.": "Мэр маленького містечка витягнув червоний килим для нових підприємств, відвідавши їх особисто.",
  "The meeting finally broke up after a three-hour discussion.": "Нарешті, після тригодичної дискусії, зустріч розпала.",
  "The minute you pull that one, your girl is out.": "Як тільки ти це зробиш, твоя дівчина вийде.",
  "The moon was on the wane.": "Місяць був на схудненні.",
  "The more I thought of my orders, the more it left a bad taste in my mouth.": "Чим більше я думав про свої накази, тим більше він залишав поганий смак у моїх ротах.",
  "The movie really should've content warned its police brutality and not just the drug use.": "Фільм повинен був попереджати про жорстокість поліції, а не тільки про наркотики.",
  "The new bond issue now appears to be on the bubble, with support eroding.": "Новий випуск облигацій зараз, здається, на пузырі, з ерозією підтримки.",
  "The new boss would like to keep the present secretary on.": "Новий бос хотів би зберегти нинішнього секретаря.",
  "The new chairman is happy to take a back seat when it comes to day-to-day operations.": "Новий голова радий зайняти заднє місце, коли мова йде про щоденні операції.",
  "The numbers I got for that were all over the board.": "Цифри, які я отримав за це, були по всій долі.",
  "The official report runs to several thousand pages in 12 volumes.": "Офіційний звіт складає кілька тисяч сторінок у 12 томах.",
  "The paper shredder seems to have gone walkabout.": "Здається, рушильник паперу випав.",
  "The patient is feeling a little better, but she's not out of the woods yet.": "Пацієнт відчуває себе трохи краще, але вона ще не вийшла з лісу.",
  "The pilot managed to put down in a nearby farm field.": "Пілоту вдалося приземлитися на сусідньому фермі.",
  "The plan worked a treat.": "План спрацював.",
  "The plans for the new building were rushed through.": "Плани нового будівлі були поспешними.",
  "The police came in to break up the disturbance.": "Поліція прийшла, щоб порушити бушування.",
  "The police chased the suspect for two days before he finally gave them the slip and vanished.": "Поліція переслідувала підозрюваного два дні, перш ніж він, нарешті, випустив їх і зник.",
  "The polls suggest that the candidates were neck and neck in the election.": "Опитування свідчать про те, що кандидати на виборах були спільними.",
  "The previous presentation ran over and ours had to start late.": "Попередня презентація закінчилася, а наша почалася пізно.",
  "The proposal should be discussed on its merits.": "Пропозиція має бути обговорювана на її основі.",
  "The renovation is coming along nicely, and should be ready within a month.": "Ремонт йде добре, і він повинен бути готовий протягом місяця.",
  "The rent was carried over to December.": "В оренді було перенесено до грудня.",
  "The restaurant had been talked up way too much, that it left me somewhat disappointed.": "Ресторан був розмовлений занадто багато, що він залишив мене трохи розчарований.",
  "The role in the soap opera was the kiss of death for Ann's career as a theatrical actress.": "Роль в сопунопере була поцілуванням смерті для кар'єри Анн як театральної актриси.",
  "The salesman persisted in quoting a rate higher than was listed, until we called him on it.": "Продавець наполягав на виведенні вищої ставки, поки ми не звернулися до нього.",
  "The senator needs to make over his image.": "Сенатору потрібно переправити свій імідж.",
  "The soldiers were instructed to take out the enemy base by any means necessary.": "Войникам було доручено знищити військову базу будь-якими необхідними засобами.",
  "The soldiers were ready at a moment's notice.": "Воїни були готові на момент.",
  "The squeaking won’t do any harm, but if it makes your teeth itch, oil the hinge.": "Викриття не завдасть шкоди, але якщо це змусить зуби сверднути, наживіть шланг.",
  "The story is based off of historical accounts.": "Історія ґрунтується на історичних звітах.",
  "The taxi put him down outside the hotel.": "Таксі посадила його біля готелю.",
  "The teacher ripped into Johnny when he found out he had plagiarised.": "Учитель зламався з Джоні, коли дізнався, що він плагієвав.",
  "The team came through in the end and won the pennant.": "Команда вийшла нарешті і виграла первенство.",
  "The tenant was annoyed by the proposed rent increase, but the cost of moving would be even higher, so he bit the bullet and signed the new lease.": "Наемник був роздражений запропонованим підвищенням оренди, але вартість переїзду була ще вищою, тому він покусив кулю і підписав новий орендний контракт.",
  "The thief finally turned himself in at the police station.": "Крадіж, нарешті, здався на поліцію.",
  "The third movie in the trilogy has been in development hell for ten years already! I want to see how the story ends!": "Третій фільм у трилогії вже десять років знаходиться в пеклі розвитку! Я хочу побачити, як закінчиться історія!",
  "The three-day party had been a lot of fun, but now it was time to pay the fiddler.": "Триденна вечірка була дуже весела, але тепер прийшов час заплатити віолончелю.",
  "The tour guide was certainly up on his history.": "Говоріць, безумовно, пізнав його історію.",
  "The vegetables were okay, but the soup was nothing to write home about.": "З овочів було все в порядку, але зіп не було про що писати додому.",
  "Their plans to go hiking Saturday fell through because it rained.": "Їхні плани піти в суботу не спрацювали, тому що дощовало.",
  "Them all came late this morning.": "Всі вони прийшли пізно сьогодні вранці.",
  "There are no two ways about it. We'll have to start over from the very beginning.": "Немає двох варіантів, ми повинні почати все з початку.",
  "There are only 258 more shopping days until Christmas, but who's counting?": "До Різдва залишилося лише 258 днів для покупки, але хто рахуває?",
  "There were ducks, geese, swans, you name it on the lake.": "У озері були патики, гуси, лебеди.",
  "There's no use trying to tell him; he won't listen.": "Немає сенсу намагатися йому сказати; він не прислухається.",
  "These crisps should hold me over until supper.": "Ці чипси повинні тримати мене до обіду.",
  "These photos are taking me out.": "Ці фотографії забирають мене.",
  "These shirts are very expensive. Mind you, they are excellent quality.": "Ці футболки дуже дорогі. Пам'ятайте, вони відмінної якості.",
  "These shoes will be more comfortable after they have broken in.": "Ці взуття будуть зручнішими після того, як вони проникнуть.",
  "They all went out to whoop it up on his 21st birthday.": "Вони всі вийшли на його 21-річний день народження.",
  "They always have some wonderful new project in the works.": "У них завжди є нейкі чудові нові проекти.",
  "They bent over backwards to make sure everything was just right for the visit.": "Вони зігнулися назад, щоб переконатися, що все було правильно для відвідування.",
  "They call out 304 stainless steel in the drawing, but the part was made from aluminum.": "У малюнку висловлюється 304 нержавеюча сталь, але частина була зроблена з алюмінію.",
  "They can turn over about three hundred units per hour.": "Вони можуть перевертати близько 300 одиниць на годину.",
  "They decided that his performance was not up to scratch.": "Вони вирішили, що його виступ не був досконалим.",
  "They expect their opponents to stand their ground on the issue.": "Вони очікують, що їхні опоненти будуть стояти на своїй стороні.",
  "They frequently put down their little sister for walking slowly.": "Вони часто забирали свою маленьку сестру за повільну ходьбу.",
  "They had a hard time putting the self-assembly furniture together without a manual.": "Їм було важко зібрати меблі, які вони самі збирали, без рукопису.",
  "They ordered the troops to stand down for the moment.": "Вони наказали військам зупинитися на даний момент.",
  "They pulled out all the stops for the gala wedding.": "Вони витягли всі зупинки для вечіркової весілля.",
  "They raised my electricity rates again. What’s up with that?": "Вони знову підвищили ціни на електроенергію.",
  "They ran so fast I could hardly keep up.": "Вони бігли так швидко, що я ледь міг догонятися.",
  "They replaced the entire door, in hopes of correcting the sticking and squeaking once and for all.": "Вони замінили всі двері, у надії виправити притикання і крик назавжди.",
  "They sat down and had a long-overdue heart to heart about the future of their relationship.": "Вони сиділи і вже давно розмовляли про майбутнє свого стосунку.",
  "They say my way of doing things is slower, but I think they'll change their tune as soon as they try it.": "Вони кажуть, що мій спосіб справи повільніший, але я думаю, що вони змінить свій тон, як тільки спробують.",
  "They spent the whole visit talking a mile a minute, and then went home and phoned each other!": "Вони весь візит проводили, розмовляючи за кілометром в хвилину, а потім йшли додому і подзвонили один одному!",
  "They started firing all over the place.": "Вони почали стріляти всюди.",
  "They stood by us all along and it's awesome to see them out here to support us today.": "Вони завжди стояли поруч з нами, і це чудово бачити, як вони підтримують нас сьогодні.",
  "They took this three-second sound bite and ran with it to try to smear me.": "Вони взяли трисекундний звуковий укус і побігли з ним, щоб спробувати помалювати мене.",
  "They turned over the evidence to the authorities.": "Вони передали докази владі.",
  "They went all out for his eightieth birthday party and chartered a tour boat on the bay.": "Вони пішли на його 80-річну вечірку і арендували туристичну лодку на затоці.",
  "They were going to stay in and read, but instead went out shopping.": "Вони збиралися залишитися і читати, але замість цього вийшли на покупки.",
  "They will need to step up production if they are going to compete.": "Їм доведеться збільшити виробництво, якщо вони збираються конкурувати.",
  "They worked around the clock to finish the project on time.": "Вони працювали круглосуточно, щоб завершити проект на час.",
  "They'll have to step on it to finish the paper tonight.": "Вони повинні піти на нього, щоб закінчити газету сьогодні.",
  "They're gonna get hitched next Saturday.": "Вони одружуються наступну суботу.",
  "They've been stepping out since he told her he was interested in a family.": "Вони виходили з дому з тих пір, як він сказав їй, що його цікавить сім'я.",
  "Things started looking up after Jim moved back in with his parents.": "Різниця почала покращатися після того, як Джим повернувся до батьків.",
  "This beginners' course only scratches the surface of the subject.": "Цей курс для початківців лише драбує поверхню тематики.",
  "This bright light shows up the dust in the corners of the room.": "Цей яскравий світло показує пылу в кутах кімнати.",
  "This country is a financial basket case, a country so broke that it should be a perfect warning to lenders.": "Ця країна є фінансовою корзиною, країна настільки банкрутна, що це має бути ідеальним попередженням для кредиторів.",
  "This expensive software is not all it's cracked up to be. It still has a lot of problems.": "Цей дорогий програмний додаток не все, що він розкритий. Він все ще має багато проблем.",
  "This insurance company is an expert at cutting red tape to process your claim faster.": "Ця страхова компанія є експертом у скороченні бюрократії, щоб швидше обробляти ваш попит.",
  "This is a Government that meets its economic targets and does not move the goalposts.": "Це уряд, який досягає своїх економічних цілей і не рухає головних стовп.",
  "This is only the tip of the iceberg. Our time together can become much more exciting.": "Це лише вершина айсберга.",
  "This is way over my head. Can you explain it more simply?": "Це заперечує мою думку. Ви можете пояснити це простіше?",
  "This isn't working. Let's back up and think about it.": "Це не працює, повернемося назад і подумайте про це.",
  "This isn't worth anything like what you paid them. I think they pulled a fast one on you.": "Це не варте того, що ти їм заплатив.",
  "This modern art is too way out for me.": "Це сучасне мистецтво занадто далеко для мене.",
  "This report is certainly not comprehensive; it is more of a \"Marketing Division at a glance\".": "Цей доповідь, безумовно, не є повним; це більше \"Маркетинговий відділ на перший погляд\".",
  "This vegetable soup is a great winter warmer.": "Цей овочевий суп - відмінний зимовий теплівець.",
  "Tonight, I'm going to focus pocus on my homework so I can get an A for my test.": "Сьогодні я зосереджуся на домашніх завданнях, щоб отримати \"А\" на тесті.",
  "Touch base with your boss before you start work to make sure you understand the project.": "Зверніться до свого начальника перед тим, як почати працювати, щоб переконатися, що ви розумієте проект.",
  "Trees fall into two main categories: deciduous and evergreen.": "Дерева підпадають у дві основні категорії: лісні та вічнозелені.",
  "Try to keep your cool and not get het up.": "Спробуй бути спокійним і не піднімайся.",
  "Try to put your best foot forward at all times during a job interview.": "Постарайтеся завжди робити все можливе під час інтерв'ю.",
  "Turn down the blankets to let them air out.": "Зверніть ковдри, щоб вони вивільнювали.",
  "Turn down the television so I can hear myself think.": "Виключіть телевізор, щоб я могла почути, як думаю.",
  "Turn out the lights before you leave.": "Зганяй світло перед тим, як піти.",
  "Unless anything comes up, I'll be there every day this week.": "Якщо нічого не вийде, я буду там кожен день цього тижня.",
  "Wait, I didn't catch what you just said. Run it back for me, please.": "Почакай, я не зрозумів те, що ти сказав.",
  "Walking through the graveyard late at night really gives me the creeps.": "Прогулятися по кладовищі пізно вночі мені дуже страшно.",
  "Washboards went the way of the dinosaurs when washing machines became commonplace.": "Вашові табори були на шляху динозаврів, коли митальні машини стали звичайними.",
  "Watching the political commentators on cable news channels always gets him fired up.": "Глядаючи на політичних коментаторів на кабельних новинних каналах, він завжди піднімається.",
  "We bought this house specifically because it backs up to our son's school.": "Ми купили цей будинок спеціально тому, що він є до школи нашого сина.",
  "We busted our tails and won; we really gave 110% in that game.": "Ми зламали свій хвост і виграли; ми дійсно дали 110% в цій грі.",
  "We came back outside and the neat pile of leaves we had raked had been blown all over hell’s half acre.": "Ми повернулися на вулицю і прихована купа листя, яку ми викопали, була роздута по півакру пекла.",
  "We can put you up for the night.": "Ми можемо привезти тебе на ніч.",
  "We can really make time if we take the freeway.": "Ми дійсно можемо знайти час, якщо підемо автострадою.",
  "We can turn around 500 units by next week.": "До наступного тижня ми зможемо повернути близько 500 одиниць.",
  "We can't afford for the performance to run on for more than the specified time.": "Ми не можемо дозволити виступу тривати довше зазначеного часу.",
  "We can't get a loan, so we'll just have to pull ourselves up by our bootstraps.": "Ми не можемо отримати кредит, тому нам просто доведеться підтягнути себе за наших стартових поясів.",
  "We decided to vacation in Las Vegas on the spur of the moment.": "Ми вирішили відпочивати в Лас-Вегасі.",
  "We didn't tell our friends that we were dating, but I think they put two and two together.": "Ми не сказали нашим друзям, що ми зустрічаємося, але я думаю, вони склали два і два разом.",
  "We don't have much time here. Could you cut to the chase?": "У нас тут мало часу.",
  "We got our wires crossed so I went to the bus station and she headed to the railway station.": "Ми пересікали провідники, тому я пішов на автобусну станцію, а вона - на залізницю.",
  "We had to sit through a 2-hour awards ceremony before the food arrived.": "Ми повинні були сидіти на 2-годинній церемонії вручення премії, перш ніж їжа прийшла.",
  "We have declared that we stand with the protestors.": "Ми заявили, що стоїмо з протестувальниками.",
  "We have just a postage stamp of a back garden.": "У нас тільки поштова марка заднього саду.",
  "We hope someday she and her mother will come to terms on the matter.": "Ми сподіваємося, що коли-небудь вона і її мама прийдуть до угоди.",
  "We must move out before the end of the month or we'll be paying extra rent.": "Ми повинні переїхати до кінця місяця або ми будемо платити додаткову оренду.",
  "We need more people to join IRC, full stop.": "Нам потрібно більше людей, щоб приєднатися до IRC.",
  "We need to know more about this new chap. Why don't you go to his home town and ferret around a bit? See what you can come up with.": "Ми повинні дізнатися більше про цього нового хлопця.",
  "We need to talk about Johnny's tendency to cut up in class.": "Ми повинні поговорити про тенденцію Джонні перерізатися в класі.",
  "We organize this Thanksgiving dinner at the old-age home to give back to the community.": "Ми організовуємо Вечерю Дня подяки в будинку престарілих, щоб віддати назад суспільству.",
  "We went to a karaoke bar and had a barrel of laughs.": "Ми пішли в караоке-бар і сміялися.",
  "We were hard up for amusements.": "Ми були дуже розважені.",
  "We were just standing around shooting the breeze.": "Ми просто стоїли тут і стріляли вітром.",
  "We were sitting at the bar when old mate came and asked us for a cigarette.": "Ми сиділи в барі, коли старий друг прийшов і попросив нас курити.",
  "We will have to hold over these files until tomorrow.": "Ми повинні зберегти ці файли до завтра.",
  "We will run through scene 2 until we get it right.": "Ми пройдемо сцену 2 поки не зробимо все правильно.",
  "We'll have to walk; my car has fallen over.": "Нам доведеться піти пешком; моя машина звалилася.",
  "We're expected to just do it at the drop of a hat.": "Очікується, що ми просто зробимо це на кінець шапки.",
  "We're going to make over the garage into a guest suite.": "Ми перетворимо гараж у гостинний номер.",
  "We're interested in buying this house. Can we look around tomorrow?": "Ми зацікавлені в покупці цього будинку. Можемо подивитися довкола нас завтра?",
  "We've sussed him out—he only drinks on Fridays and only in that bar in town.": "Він п'є тільки в п'ятницю і тільки в цьому барі в місті.",
  "Welcome back! It's good to see you back on your feet.": "Добре, що ти знову стоїш.",
  "Welcome to my world. Now you know how I feel about it, and how it hurts me. Why don't you help me then?": "Вітаю вас у моєму світі. Тепер ви знаєте, як я відчуваю це, і як це болить мене.",
  "Well yes, it was quite a good bargain; on the other hand, do we really need one?": "Ну так, це була досить хороша угода; з іншого боку, чи нам дійсно потрібна?",
  "Well, I checked everything and I think it's wired up correctly, so I guess all that's left is to turn it on. Here goes nothing!": "Я все перевірив і думаю, що він правильно підключений, так що все, що залишилося, це включити його.",
  "Well, what do you know, it's raining again.": "Ну, що ти знаєш, знову йде дощ.",
  "What a tragedy, that someone would set off a bomb in a crowded place.": "Яка трагедія, що хтось розбудить бомбу в переповненому місці.",
  "What fresh hell is this?": "Що це за свіжий пекло?",
  "What's good here? I'm way too indecisive to choose from a menu.": "Я занадто нерішучий, щоб вибирати з меню.",
  "What's that old coot flapping his gums about this time?": "Про що цей старий ковчег цього разу клапає за зуби?",
  "What's the matter with Fred? Oh, he's just having a bad hair day.": "Що з Фредом?",
  "What's the use trying to tell him? He won't listen.": "Чим ти намагаєшся йому сказати?",
  "What's with Jim lately? He always has a frown on his face.": "Що з Джимом останнім часом?",
  "When I flushed the toilet, the plumbing backed up and burst.": "Коли я кинув туалет, водопроводний підскочив і вибухнув.",
  "When a politician claims he can lower taxes without cutting spending, he's lying through his teeth.": "Коли політик стверджує, що він може знизити податки без скорочення витрат, він бреше за зуби.",
  "When he walks his dog the girls all want to pet it – it's a real chick magnet.": "Коли він прогулює свою собаку, всі дівчата хочуть поцілувати її. Це справжній магніт для дівчаток.",
  "When it came to the tournament, our team didn't get a look in.": "Коли йдеться про турнір, наша команда не подивилася.",
  "When joining a road, you should check for traffic before pulling out.": "Коли підключаєшся до дороги, слід перевірити, чи є трафік, перш ніж вийти.",
  "When my mother started telling me to be careful over the phone, I threatened to hang up on her.": "Коли моя мама почала казати мені бути обережним по телефону, я погрожував підвесити її.",
  "When quoting others, take care not to run afoul of copyright rules.": "Коли цитуєте інших, будьте обережні, щоб не порушувати правила авторського права.",
  "When she called him a drunk, it was the last straw. He just kicked off.": "Коли вона назвала його п'яним, це було останнє.",
  "When she gets on her high horse there is not much to do but go along with it or wait for it to pass.": "Коли вона сіде на свій високий кінь, є мало чого зробити, але піти з ним або чекати, щоб він пройшов.",
  "When the boss wasn't around on the weekend they would sometimes screw off.": "Коли шеф не був у вихідні, вони іноді зіпсували.",
  "When the telephone first came along, it was mostly just for businesses and rich people, but eventually almost everyone got one.": "Коли вперше з'явився телефон, він був переважно для бізнесу і багатих людей, але в кінцевому підсумку майже кожен отримав його.",
  "When we go to visit, do remember to mind your ps and qs, children – we don't want another incident like last time.": "Коли ми поїдемо на візит, пам'ятайте, щоб пам'ятати про свої PS і Qs, діти, ми не хочемо ще одного інциденту, як минулого разу.",
  "When you buy a top-of-the-line refrigerator, you expect it to work for many years.": "Коли ви купуєте передові холодильники, ви очікуєте, що вони будуть працювати протягом багатьох років.",
  "Whenever I'm upset, I look to Mary to cheer me up.": "Коли я засмучений, я звертаюся до Мері, щоб підбадьорювати мене.",
  "While I was cleaning the kitchen cupboards, I ran across Mother's recipe for Cornish game hens.": "Коли я чистив кухонні гардероби, я наткнувся на рецепт матір'ї на коринські кури.",
  "While we are not able to assist you at this point in time, we will be sure to call you if an opportunity arises.": "Хоча ми не зможемо вам допомогти в цей момент, ми обов'язково зателефонуємо вам, якщо з'явиться можливість.",
  "While you're in the city center, look out for the dodgy street vendors.": "Поки ви в центрі міста, будьте обережні від недовідних вуличних продавців.",
  "Why are you so grumpy? – Coming from you!": "Чому ти так груба?",
  "Why don't we stop and take a breather before we continue?": "Чому б нам не зупинитися і не відпочити, перш ніж продовжити?",
  "Why don’t you just zip your lip? I’m tired of listening to you.": "Чому б ти просто не закрити губ? Я втомився слухати тебе.",
  "Why're you crying? What's the matter?": "Чому ти плачеш?",
  "With any luck, we'll be able to finish our assignment before the deadline.": "Якщо нам пощастить, ми зможемо завершити завдання до терміну.",
  "With the company merger out of sight, the bankruptcy will proceed.": "З вилученням компанії з'явиться банкрутство.",
  "Won't anyone step up to the challenge?": "Хтось не прийде до виклику?",

function home(id='home'){
  practiceColor(id);
  const sections=Object.keys(practiceTitles);
  view.innerHTML=`<div class="section-carousel" aria-label="Навчальні розділи" tabindex="0">
    ${sections.map(sectionPanel).join('')}
  </div>
  <div class="carousel-guide">
    <span>Гортай убік</span>
    <div class="carousel-dots" aria-hidden="true">${sections.map(()=>'<i></i>').join('')}</div>
    <span class="section-position" id="section-position" aria-live="polite"></span>
  </div>
  <div id="verb-modes">
    <h2>Окремі вправи</h2>
    <div class="grid">${names.map((name,i)=>
      `<button class="tile" onclick="start(${i})"><b>${name}</b><small>${desc[i]}</small></button>`
    ).join('')}</div>
  </div>
  <footer><span>Раундів: ${stats.rounds}</span><span>Балів: ${stats.points}</span></footer>`;

  const carousel=view.querySelector('.section-carousel');
  const pages=[...carousel.children];
  const dots=[...view.querySelectorAll('.carousel-dots i')];
  const position=view.querySelector('#section-position');
  const verbModes=view.querySelector('#verb-modes');
  let active=sections.indexOf(id);

  function offset(i){return pages[i].offsetLeft-pages[0].offsetLeft}
  function showActive(){
    practiceColor(sections[active]);
    position.textContent=practiceTitles[sections[active]]+' · '+(active+1)+' / '+sections.length;
    verbModes.hidden=sections[active]!=='home';
    for(const [i,page] of pages.entries()){
      page.inert=i!==active;
      dots[i].classList.toggle('active',i===active);
    }
  }
  function goTo(i){
    active=Math.min(Math.max(i,0),sections.length-1);
    carousel.scrollLeft=offset(active);
    showActive();
  }
  function nearest(){
    return pages.reduce((best,_,i)=>Math.abs(offset(i)-carousel.scrollLeft)<Math.abs(offset(best)-carousel.scrollLeft)?i:best,0);
  }
  carousel.onscroll=()=>{
    const i=nearest();
    if(i!==active){
      active=i;
      showActive();
    }
  };
  carousel.onkeydown=event=>{
    if(event.target!==carousel||!['ArrowLeft','ArrowRight'].includes(event.key))return;
    event.preventDefault();
    goTo(active+(event.key==='ArrowRight'?1:-1));
  };

  let drag=null;
  let suppressClick=false;
  carousel.onpointerdown=event=>{
    if(event.pointerType!=='mouse'||event.button!==0)return;
    suppressClick=false;
    drag={id:event.pointerId,x:event.clientX,left:carousel.scrollLeft};
  };
  carousel.onpointermove=event=>{
    if(!drag||event.pointerId!==drag.id)return;
    if(event.buttons!==1){
      endDrag(event);
      return;
    }
    const delta=event.clientX-drag.x;
    if(!suppressClick&&Math.abs(delta)<6)return;
    if(!suppressClick){
      suppressClick=true;
      carousel.classList.add('dragging');
      carousel.setPointerCapture(drag.id);
    }
    carousel.scrollLeft=drag.left-delta;
    event.preventDefault();
  };
  function endDrag(event){
    if(!drag||event.pointerId!==drag.id)return;
    drag=null;
    if(!suppressClick)return;
    const target=nearest();
    carousel.classList.remove('dragging');
    goTo(target);
  }
  carousel.onpointerup=endDrag;
  carousel.onpointercancel=endDrag;
  carousel.onlostpointercapture=endDrag;
  carousel.addEventListener('click',event=>{
    if(!suppressClick||event.detail===0)return;
    suppressClick=false;
    event.preventDefault();
    event.stopPropagation();
  },true);
  goTo(active);
}

const normalizeLibrary=text=>text.toLowerCase().replace(/[’‘]/g,"'").trim();

function escapeText(text){
  return text.replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[char]);
}

function libraryEntries(id){
  const curated=libraryData[id].rows.map(([word,meaning,example,translation,note,construction])=>({
    word,term:construction||word,meaning,example,translation,note,lang:'uk'
  }));
  const curatedTerms=new Set(curated.map(entry=>normalizeLibrary(entry.term)));
  const imported=(typeof sourcedLibrary==='undefined'?[]:sourcedLibrary[id])
    .filter(entry=>!curatedTerms.has(normalizeLibrary(entry.term)))
    .map(entry=>({...entry,note:entry.register,lang:'en',
    translation:typeof libraryTranslationsUk==='undefined'?'':libraryTranslationsUk[entry.example]||'',
    machineTranslated:true,
    source:'https://en.wiktionary.org/wiki/'+encodeURIComponent(entry.term.replaceAll(' ','_'))+'#English'}));
  return [...curated,...imported];
}
