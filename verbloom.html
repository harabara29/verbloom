const catalog={...Object.fromEntries(Object.keys(libraryData).map(id=>[id,libraryEntries(id)])),b2:b2Words};

function practiceColor(id){
  document.documentElement.dataset.practice=id;
  updateThemeColor();
}

const reviewKey='verbloomReviewV1';
let savedReviews={};
try{savedReviews=JSON.parse(localStorage.getItem(reviewKey)||'{}')||{}}catch{}

function reviewItems(){
  return {
    ...Object.fromEntries(verbs.map(word=>[verbReviewId(word),{title:word.slice(0,3).join(' → '),group:'home'}])),
    ...Object.fromEntries(cases.map(scene=>[sceneReviewId(scene),{title:scene[1],group:'home'}])),
    ...Object.fromEntries(Object.entries(catalog).flatMap(([group,entries])=>entries.map(entry=>[
      vocabReviewId(group,entry),{title:entry.term,detail:entry.example.replaceAll('~',''),group}
    ])))
  };
}

function verbReviewId(word){return JSON.stringify(['verb',word[0]])}
function sceneReviewId(scene){return JSON.stringify(['scene',scene[1]])}
function vocabReviewId(group,entry){return JSON.stringify([group,entry.term,entry.meaning])}

function availableForReview(id,now=Date.now()){
  return !savedReviews[id]||savedReviews[id].dueAt<=now;
}

function reviewDeadline(now,stage){
  const date=new Date(now);
  if(stage===1){
    date.setDate(date.getDate()+21);
  }else{
    const day=date.getDate();
    date.setDate(1);
    date.setMonth(date.getMonth()+6);
    const lastDay=new Date(date.getFullYear(),date.getMonth()+1,0).getDate();
    date.setDate(Math.min(day,lastDay));
  }
  return date.getTime();
}

function markLearned(id,now=Date.now()){
  const saved=savedReviews[id];
  if(saved&&saved.dueAt>now)return saved;
  const stage=saved?2:1;
  const entry={stage,dueAt:reviewDeadline(now,stage)};
  savedReviews[id]=entry;
  try{localStorage.setItem(reviewKey,JSON.stringify(savedReviews))}catch{}
  return entry;
}

function randomizedAvailable(list,idFor){
  const now=Date.now();
  const eligible=shuffle(list.filter(item=>availableForReview(idFor(item),now)));
  return eligible.sort((a,b)=>Number(Boolean(savedReviews[idFor(b)]))-Number(Boolean(savedReviews[idFor(a)])));
}

const reviewDate=new Intl.DateTimeFormat('uk-UA',{dateStyle:'long'});

function learnedButton(id){
  return `<button type="button" class="learned-button" data-review-id="${escapeText(id)}"
    ${availableForReview(id)?'':'disabled'}>${availableForReview(id)?'Вивчено':'До '+reviewDate.format(savedReviews[id].dueAt)}</button>`;
}

function emptyPractice(id){
  view.innerHTML=`<div class="panel"><h2>Наразі немає завдань</h2>
    <button class="primary" type="button" onclick="openReviews()">Переглянути черги</button>
    <button type="button" onclick="home('${id}')">До розділу</button></div>`;
}

function openReviews(){
  practiceColor('home');
  const items=reviewItems();
  const now=Date.now();
  function queue(stage){
    const rows=Object.entries(savedReviews)
      .filter(([id,info])=>items[id]&&info.stage===stage&&info.dueAt>now)
      .sort(([,a],[,b])=>a.dueAt-b.dueAt);
    return `<section class="review-queue"><h2>${stage===1?'Через 21 день':'Через пів року'}</h2>
      ${rows.length?rows.map(([id,info])=>{
        const item=items[id];
        return `<article class="library-entry"><small>${practiceTitles[item.group]}</small>
          <h3 lang="en">${escapeText(item.title)}</h3>
          ${item.detail?`<p lang="en">${escapeText(item.detail)}</p>`:''}
          <p class="meta">Повернеться ${reviewDate.format(info.dueAt)}</p></article>`;
      }).join(''):'<p class="meta">Черга порожня.</p>'}</section>`;
  }
  view.innerHTML=`<h1 class="review-title">Вивчене</h1>
    <p class="meta">Коли настане дата, завдання знову з’явиться у практиці.</p>
    <div class="review-queues">${queue(1)}${queue(2)}</div>`;
}

view.addEventListener('click',event=>{
  const button=event.target.closest('[data-review-id]');
  if(!button||button.disabled)return;
  const record=markLearned(button.dataset.reviewId);
  button.disabled=true;
  button.textContent='До '+reviewDate.format(record.dueAt);
  const status=document.createElement('span');
  status.className='review-status';
  status.setAttribute('role','status');
  status.textContent=record.stage===1?' Додано до черги на 21 день.':' Додано до черги на пів року.';
  button.after(status);
});

function sourceLink(entry){
  return entry.source?`<a class="entry-source" href="${escapeText(entry.source)}" target="_blank" rel="noopener noreferrer">Wiktionary</a>`:'';
}

function entryExample(entry){
  const example=escapeText(entry.example);
  if(example.includes('~'))return example.replace(/~([^~]+)~/g,'<mark>$1</mark>');
  const phrase=escapeText(entry.term).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return example.replace(new RegExp('\\b'+phrase+'\\b','i'),'<mark>$&</mark>');
}

function sentenceBlock(example,translation,machineTranslated=false){
  return `<div class="sentence-block">
    <span class="sentence-label">Речення</span>
    <p class="question" lang="en">${example}</p>
    ${translation?`<details class="sentence-translation">
      <summary>Переклад речення</summary>
      <p lang="uk">${escapeText(translation)}</p>
      ${machineTranslated?'<small>Автоматичний переклад</small>':''}
    </details>`:''}
  </div>`;
}

function libraryCard(entry,id){
  return `<article class="library-entry context-card">
    <h3 lang="en">${escapeText(entry.term)}</h3>
    <p lang="${entry.lang}"><strong>${escapeText(entry.meaning)}</strong></p>
    <p class="library-example" lang="en">${entryExample(entry)}</p>
    ${entry.translation?`<p class="library-translation">${escapeText(entry.translation)}</p>`:''}
    ${entry.machineTranslated&&entry.translation?'<small>Автоматичний переклад</small>':''}
    ${entry.note?`<p class="library-note">${escapeText(entry.note)}</p>`:''}
    ${sourceLink(entry)}
    <div class="library-card-actions">${learnedButton(vocabReviewId(id,entry))}</div>
  </article>`;
}

function openLibrary(id){
  practiceColor(id);
  const entries=catalog[id];
  const wordChoices=id==='words'?[...new Set(entries.map(entry=>entry.word))]:[];
  view.innerHTML=`<div class="library-intro">
      <div><h2>${practiceTitles[id]}</h2><p class="meta">Записів у базі · ${entries.length}</p></div>
      <button class="primary" id="practice-library">Почати практику</button>
    </div>
    <input id="library-search" type="search" aria-label="Пошук у вкладці" placeholder="Шукати англійською або українською">
    ${wordChoices.length?`<label class="word-filter">Слово
      <select id="word-choice">${wordChoices.map(word=>`<option>${escapeText(word)}</option>`).join('')}</select>
    </label>`:''}
    <div id="library-list"></div>
    <button id="library-more" type="button" hidden>Показати ще</button>
    ${id==='b2'
      ?`<p class="library-credits">Рівень лексики · <a href="${oxfordB2Url}">Oxford 3000</a></p>`
      :'<p class="library-credits">Словникові записи англійською · <a href="https://kaikki.org/dictionary/English/index.html">Wiktionary через Kaikki</a> · <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a></p>'}`;
  const search=view.querySelector('#library-search');
  const choice=view.querySelector('#word-choice');
  view.querySelector('#practice-library').onclick=()=>launchPractice(id);
  const list=view.querySelector('#library-list');
  const more=view.querySelector('#library-more');
  const pageSize=24;
  let matching=[],shown=0;

  function renderMore(){
    list.insertAdjacentHTML('beforeend',matching.slice(shown,shown+pageSize).map(entry=>libraryCard(entry,id)).join(''));
    shown+=pageSize;
    more.hidden=shown>=matching.length;
  }

  function filter(){
    const query=normalizeLibrary(search.value);
    matching=entries.filter(entry=>query
      ?normalizeLibrary([entry.word,entry.term,entry.meaning,entry.example,entry.translation,entry.note].join(' ').replaceAll('~','')).includes(query)
      :!choice||entry.word===choice.value);
    shown=0;
    list.className='context-grid';
    list.innerHTML=matching.length?'':'<p>Збігів немає.</p>';
    renderMore();
  }

  search.oninput=filter;
  if(choice)choice.onchange=()=>{
    search.value='';
    filter();
  };
  more.onclick=renderMore;
  filter();
}

function launchPractice(id){
  window.scrollTo(0,0);
  if(id==='home'){
    start(4);
    return;
  }
  const available=randomizedAvailable(catalog[id],entry=>vocabReviewId(id,entry));
  const used=new Set();
  const questions=[];
  for(const entry of available){
    const term=normalizeLibrary(entry.term);
    if(used.has(term))continue;
    used.add(term);
    questions.push(entry);
    if(questions.length===5)break;
  }
  playVocabulary(id,questions);
}

function meaningOptions(id,entry){
  const seen=new Set([normalizeLibrary(entry.meaning)]);
  const leadingWord=meaning=>normalizeLibrary(meaning).replace(/^to /,'').match(/^[a-z]+/)?.[0];
  const mainWord=leadingWord(entry.meaning);
  const sameWord=candidate=>candidate.word===entry.word;
  const candidates=shuffle(catalog[id].filter(candidate=>candidate.lang===entry.lang&&candidate.term!==entry.term));
  candidates.sort((a,b)=>Number(sameWord(b))-Number(sameWord(a)));
  const distractors=[];
  for(const candidate of candidates){
    const key=normalizeLibrary(candidate.meaning);
    if(seen.has(key)||mainWord&&mainWord===leadingWord(candidate.meaning))continue;
    seen.add(key);
    distractors.push(candidate.meaning);
    if(distractors.length===3)break;
  }
  return distractors;
}

function playVocabulary(id,questions){
  practiceColor(id);
  let position=0;
  let correct=0;
  const mistakes=[];
  if(!questions.length){
    emptyPractice(id);
    return;
  }

  function showQuestion(){
    const entry=questions[position];
    const fillGap=id==='b2'&&position%2===1;
    const answer=fillGap?entry.term:entry.meaning;
    const choices=shuffle([answer,...(fillGap?entry.alternatives:meaningOptions(id,entry))]);
    const example=fillGap
      ?escapeText(entry.example).replace(/~[^~]+~/,'<span class="b2-gap" aria-label="Пропущене слово">…</span>')
      :entryExample(entry);
    const prompt=fillGap?'Обери слово для пропуску':id==='b2'?'Обери значення слова':id==='words'?'Що означає конструкція в цьому реченні?':'Обери значення вислову';
    view.innerHTML=`<div class="panel vocabulary-panel">
      <div class="row"><b>${practiceTitles[id]}</b><small>${position+1} / ${questions.length}</small></div>
      <progress value="${position}" max="${questions.length}" aria-label="Прогрес раунду"></progress>
      <p class="meta">${prompt}</p>
      ${fillGap?'':`<h2 class="vocabulary-term" lang="en">${escapeText(entry.term)}</h2>`}
      ${sentenceBlock(example,entry.translation,entry.machineTranslated)}
      <div class="answers">${choices.map(choice=>`<button type="button" lang="${fillGap?'en':entry.lang}">${escapeText(choice)}</button>`).join('')}</div>
      <div id="vocabulary-feedback" role="status"></div>
      <div id="vocabulary-next"></div>
    </div>`;

    const buttons=[...view.querySelectorAll('.answers button')];
    buttons.forEach((button,i)=>{
      button.onclick=()=>{
        const ok=choices[i]===answer;
        if(fillGap)view.querySelector('.sentence-block .question').innerHTML=entryExample(entry);
        if(ok)correct++;
        else mistakes.push(entry);
        buttons.forEach((option,j)=>{
          option.disabled=true;
          if(choices[j]===answer)option.classList.add('correct-option');
          else if(i===j)option.classList.add('wrong-option');
        });
        view.querySelector('#vocabulary-feedback').innerHTML=`<div class="note${ok?'':' error'}">
          <b>${ok?'Правильно!':'Неправильно.'}</b>
          <p lang="${entry.lang}">${escapeText(entry.meaning)}</p>
          ${entry.note?`<p class="library-note">${escapeText(entry.note)}</p>`:''}
          ${sourceLink(entry)}
        </div>`;
        view.querySelector('#vocabulary-next').innerHTML=`<button class="primary" type="button">${position+1===questions.length?'Підсумок':'Далі →'}</button>
          ${learnedButton(vocabReviewId(id,entry))}`;
        const next=view.querySelector('#vocabulary-next button');
        next.onclick=()=>++position<questions.length?showQuestion():showResult();
        next.focus();
      };
    });
  }

  function showResult(){
    recordRound(correct);
    const retryable=mistakes.filter(entry=>availableForReview(vocabReviewId(id,entry)));
    view.innerHTML=`<div class="hero">
      <small>${practiceTitles[id]}</small><h1>${correct} / ${questions.length}</h1>
      <p>Правильних відповідей</p>
      <div class="result-actions">
        <button class="primary" id="vocabulary-replay">Новий раунд</button>
        ${retryable.length?'<button id="vocabulary-retry">Повторити помилки</button>':''}
        <button id="vocabulary-library">До довідника</button>
      </div>
    </div>`;
    view.querySelector('#vocabulary-replay').onclick=()=>launchPractice(id);
    const retry=view.querySelector('#vocabulary-retry');
    if(retry)retry.onclick=()=>playVocabulary(id,shuffle(retryable));
    view.querySelector('#vocabulary-library').onclick=()=>openLibrary(id);
  }

  showQuestion();
}

function start(m){
  
  practiceColor('home');
  mode=m;
  index=0;
  score=0;
  const words=randomizedAvailable(verbs,verbReviewId);
  const scenes=randomizedAvailable(cases,sceneReviewId);
  const wordQuestions=words.map(v=>({v,t:m===4?Math.floor(Math.random()*3):m,f:Math.floor(Math.random()*3)}));
  const sceneQuestions=scenes.map(c=>({c,t:3}));
  if(m===4){
    const mixed=[...wordQuestions.slice(0,3),...sceneQuestions.slice(0,2)];
    const remaining=[...wordQuestions.slice(3),...sceneQuestions.slice(2)];
    deck=shuffle([...mixed,...remaining.slice(0,5-mixed.length)]);
  }else{
    deck=(m===3?sceneQuestions:wordQuestions).slice(0,5);
  }
  if(deck.length)question();
  else emptyPractice('home');
}
function question(){
  locked=false;
  const {v,c,t,f}=deck[index];
  const word=t===3?verbs.find(verb=>verb[0]===c[2]):v;
  let answer=word[f],prompt,label,why=word.slice(0,3).join(' · '),options;
  if(t===3){
    answer=word[c[3]];
    prompt=c[1];
    label=c[0]+' · '+word[0];
    why=c[4];
  }else if(t===1){
    answer=word[2];
    label='Обери третю форму';
    prompt=word[0]+' → V3';
    options=shuffle([answer,...shuffle(verbs.filter(verb=>verb!==word)).slice(0,3).map(verb=>verb[2])]);
  }else{
    label='Заповни V'+(f+1);
    prompt=word.slice(0,3).map((form,i)=>i===f?'___':form).join(' · ');
    if(t===0)options=shuffle(Array.from(new Set([...word.slice(0,3),...shuffle(verbs).map(verb=>verb[f])])).slice(0,4));
  }

  const glosses=t===3?c[6].split('|'):[];
  let wordIndex=0;
  function wordButton(word,i){
    return `<button class="word" type="button" data-word="${i}" aria-pressed="false">${word}</button>`;
  }
  const sentence=t===3?prompt.replace(/___|[A-Za-z]+(?:['’-][A-Za-z]+)*/g,word=>{
    const i=wordIndex++;
    return word==='___'?`<span id="sentence-gap" data-word="${i}">___</span>`:wordButton(word,i);
  }):prompt;

  const example=verbExamples[word[0]];
  const showVerbInExample=f!==0||t===1;
  const verbExample=showVerbInExample?entryExample(example):escapeText(example.example).replace(/~[^~]+~/,'<span class="b2-gap" id="verb-example-gap" aria-label="Пропущене слово">…</span>');

  view.innerHTML=`<div class="panel">
    <div class="row"><b>${names[t]}</b><small>${index+1} / ${deck.length}</small></div>
    <progress value="${index}" max="${deck.length}" aria-label="Прогрес раунду"></progress>
    <p class="meta">${label}</p>
    ${t===3
      ?sentenceBlock(sentence,c[5])+'<p id="word-gloss" class="word-gloss" role="status"></p>'
      :`<p lang="en" class="question form-prompt">${sentence}</p>${sentenceBlock(verbExample,example.translation)}`}
    <details class="translation">
      <summary>Переклад трьох форм</summary>
      ${verbForms(word)}
    </details>
    <div class="answers"></div>
    <div id="feedback" role="status"></div>
    <div id="controls"></div>
  </div>`;

  const questionText=view.querySelector('.question');
  const wordGloss=view.querySelector('#word-gloss');
  if(wordGloss){
    questionText.onclick=event=>{
      const button=event.target.closest('button[data-word]');
      if(!button)return;
      questionText.querySelector('[aria-pressed="true"]')?.setAttribute('aria-pressed','false');
      button.setAttribute('aria-pressed','true');
      const english=document.createElement('b');
      english.lang='en';
      english.textContent=button.textContent;
      wordGloss.replaceChildren(english,' — '+glosses[button.dataset.word]);
    };
  }

  const answers=view.querySelector('.answers');
  function check(value){
    if(locked)return;
    locked=true;
    const ok=value.trim().toLowerCase()===answer;
    if(ok)score++;
    const gap=questionText.querySelector('#sentence-gap');
    if(gap)gap.outerHTML=wordButton(answer,gap.dataset.word);
    const verbExampleGap=view.querySelector('#verb-example-gap');
    if(verbExampleGap)verbExampleGap.outerHTML='<mark>'+escapeText(word[0])+'</mark>';
    answers.querySelectorAll('input,button').forEach(el=>el.disabled=true);
    const message=ok?'Правильно!':'Неправильно. Правильна форма — <span lang="en">'+answer+'</span>.';
    view.querySelector('#feedback').innerHTML=`<div class="note${ok?'':' error'}"><b>${message}</b><br><span lang="${t===3?'uk':'en'}">${why}</span></div>`;
    const reviewId=t===3?sceneReviewId(c):verbReviewId(v);
    view.querySelector('#controls').innerHTML=`<button class="primary" id="next">${index+1===deck.length?'Підсумок':'Далі →'}</button>${learnedButton(reviewId)}`;
    const next=view.querySelector('#next');
    next.onclick=()=>{if(++index<deck.length)question();else finish()};
    next.focus();
  }

  if(options){
    options.forEach(form=>{
      const button=document.createElement('button');
      button.lang='en';
      button.textContent=form;
      button.onclick=()=>check(form);
      answers.append(button);
    });
  }else{
    answers.innerHTML='<form><input required pattern=".*\\S.*" aria-label="Англійська форма" lang="en" autocapitalize="none" autocomplete="off" spellcheck="false" placeholder="Введи форму"><button class="primary">Перевірити</button></form>';
    answers.firstChild.onsubmit=event=>{
      event.preventDefault();
      check(answers.querySelector('input').value);
    };
  }
}
function recordRound(points){stats.rounds++;stats.points+=points;try{localStorage.verbloom=JSON.stringify(stats)}catch{}}
function finish(){recordRound(score);view.innerHTML='<div class="hero"><small>Раунд завершено</small><h1>'+score+' / '+deck.length+'</h1><p>Правильних відповідей</p><button class="primary" onclick="start(mode)">Ще один раунд →</button></div><button onclick="home()">До режимів гри</button>'}
const themeButton=document.querySelector('#theme');
function updateThemeColor(){
  document.querySelector('meta[name="theme-color"]').content=getComputedStyle(document.body).backgroundColor;
}
function updateThemeButton(){
  const dark=document.documentElement.dataset.theme==='dark';
  const label=dark?'Увімкнути світлу тему':'Увімкнути темну тему';
  themeButton.textContent=dark?'☼':'☾';
  themeButton.setAttribute('aria-label',label);
  themeButton.title=label;
  updateThemeColor();
}
themeButton.onclick=()=>{
  const root=document.documentElement;
  root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';
  try{localStorage.verbloomTheme=root.dataset.theme}catch{}
  updateThemeButton();
};
updateThemeButton();
document.querySelector('#logo').onclick=()=>{home();window.scrollTo(0,0)};
document.querySelector('#review').onclick=()=>{openReviews();window.scrollTo(0,0)};
home();
</script></html>
