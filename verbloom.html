<style>

.brand{font-size:24px;letter-spacing:0px;color:var(--accent)}

button:focus-visible,input:focus-visible,.translation summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
nav button{border:0;background:transparent;font-size:15px;padding:8px 10px}
nav [aria-current="page"]{color:var(--accent);background:var(--tint)}
.primary{color:white;background:var(--accent);border-color:var(--accent)}

.intro{display:grid;align-items:center;gap:24px}
.example{min-width:0;background:white;border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 3px 0 #dcd4ef}
.example dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:0}
.example dl>div{padding:2px 8px;border-left:1px solid var(--line)}
.example dl>div:first-child{border:0;padding-left:0}
.example dt{color:var(--accent);font-size:13px;font-weight:650}

.grid{display:grid;gap:10px}
.tile{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;width:100%;text-align:left;padding:14px 16px;border-color:var(--line)}
.tile b{font-size:17px}
.tile small{grid-column:1}
.tile:after{content:'→';grid-column:2;grid-row:1/3;align-self:center;color:var(--accent);font-size:20px}
small,.meta,footer{color:var(--muted);font-size:15px;font-weight:450}
footer{display:flex;gap:24px;margin-top:20px}
.panel{max-width:660px;padding:clamp(18px,4vw,34px);border-radius:18px;margin:24px auto 0}

input{padding:12px;border:1px solid #9189a5;border-radius:10px;width:100%;background:white;margin:10px 0}
progress{display:block;width:100%;height:6px;accent-color:var(--accent);margin:14px 0 22px}
.question{font-size:clamp(23px,4vw,33px);font-weight:630;letter-spacing:0px;line-height:1.38;margin:8px 0 16px;overflow-wrap:anywhere}
.question .word{
  display:inline;min-height:0;padding:0;border:0;border-radius:3px;
  background:transparent;color:inherit;font:inherit;letter-spacing:inherit;
  text-decoration:underline dotted var(--muted);text-underline-offset:.19em;
}
.question .word:enabled:hover,.question .word[aria-pressed="true"]{
  background:var(--tint);color:var(--accent);
}
.word-gloss{padding:8px 12px;margin:-4px 0 16px;background:var(--tint);border-left:2px solid var(--accent);border-radius:4px 8px 8px 4px}
.word-gloss:empty{display:none}
.answers{display:grid;gap:9px}
.line{padding:15px 0;border-bottom:1px solid var(--line)}
.note{padding:12px 16px;background:#edf6ef;border-left:3px solid #327146;border-radius:4px 10px 10px 4px;margin:16px 0}
.translation{margin:0 0 16px}
.translation summary{display:list-item;width:fit-content;min-height:44px;padding:9px 4px;color:var(--accent);cursor:pointer}
.forms{margin:0}
.forms>div{display:grid;grid-template-columns:2em minmax(0,1fr);gap:8px;padding:7px 4px}
.forms>div+div{border-top:1px solid var(--line)}
.forms dt{font-weight:650;color:var(--accent)}
.forms dd{margin:0}
.forms dd b{margin-right:8px}
.note.error{background:#fff1ef;color:#791f25;border-left-color:#a92e36}
button:disabled{color:var(--muted);cursor:default}
.theme-toggle{display:grid;place-items:center;width:44px;height:46px;padding:0;border:1px solid var(--line);border-radius:50%;font-size:20px;line-height:1}
header nav{gap:5px}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#101116;
  --ink:#f2eff9;
  --muted:#b6b0c5;
  --accent:#c2afff;

[data-theme="dark"] header{border-color:#2d2c39}

[data-theme="dark"] .example{
  background:radial-gradient(circle at top right,#6d59b14d,transparent 65%),#12111a;

}
[data-theme="dark"] .tile{
  --glow:#9b67ec26;

  border-color:#3c374c;

}
[data-theme="dark"] .tile:nth-child(2){--glow:#527ede32}
[data-theme="dark"] .tile:nth-child(3){--glow:#db7c7d28}
[data-theme="dark"] .tile:nth-child(4){--glow:#578dd632}
[data-theme="dark"] .tile:enabled:hover{background:radial-gradient(ellipse at top right,var(--glow),transparent 82%),#242131}
[data-theme="dark"] input{border-color:#696078}
[data-theme="dark"] .note{background:#192c25;border-color:#79bf97}
[data-theme="dark"] .note.error{background:#352027;color:#ffd3dc;border-color:#f090a3}
@media(max-width:360px){main{padding-inline:12px}.brand{font-size:20px}nav button{font-size:14px;padding-inline:5px}.theme-toggle{font-size:19px}}
@media(min-width:650px){

.library-entry{margin:12px 0;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:white}
[data-theme="dark"] .library-entry{background:var(--surface)}
.library-entry h3{font-size:21px;margin:0 0 6px;color:var(--accent)}
.library-example{margin-top:6px}
.library-translation,.library-note{color:var(--muted)}
.library-note{

}
.context-grid{display:grid;gap:10px}
.context-card{min-width:0;margin:0}

body{background:var(--practice-page,var(--paper))}
main{max-width:1080px}

}
.brand:enabled:hover,[data-theme="dark"] button.brand:enabled:hover{background:transparent}
.brand-mark{
  display:grid;place-items:center;position:relative;width:38px;height:38px;border-radius:11px;
  background:linear-gradient(150deg,#5a478b,#221c34 67%);

}
.brand-mark::before,.brand-mark::after{
  position:absolute;content:"";width:7px;height:21px;top:8px;left:15px;
  transform-origin:50% 95%;border-radius:6px 6px 2px 2px;
  background:linear-gradient(#faf8ff,#bca3ff);
}
.brand-mark::before{transform:rotate(-29deg)}
.brand-mark::after{transform:rotate(29deg);background:linear-gradient(#e0d1ff,#9d80ea)}

#review{color:var(--muted)}
.section-carousel{
  --peek:clamp(24px,6vw,54px);
  --card-gap:12px;
  display:flex;gap:var(--card-gap);overflow-x:auto;
  scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;
  padding-block:14px 10px;
}
.section-carousel::-webkit-scrollbar{display:none}
.section-carousel::after{content:"";flex:0 0 max(0px,calc(var(--peek) - var(--card-gap)))}

[data-section="words"] .section-hero{--light:#64dda3;--deep:#15523a;--ground:#0b1913}

.hero.section-hero .result-actions button:not(.primary){

}

.section-art{
  position:absolute;pointer-events:none;top:4%;right:3%;width:clamp(140px,29vw,310px);
  aspect-ratio:1;display:grid;place-items:center;color:var(--light);
}
.section-art::before,.section-art::after{
  position:absolute;content:"";border:1px solid currentColor;inset:6%;border-radius:50%;
  opacity:.35;transform:rotate(-28deg) scaleY(.65);
}
.section-art::after{transform:rotate(35deg) scaleY(.8);inset:11%;opacity:.2}
.section-art span{
  position:absolute;display:block;width:43%;aspect-ratio:1;
  border-radius:20%;border:1px solid currentColor;transform:rotate(45deg) translate(-16%,16%);
  background:linear-gradient(145deg,color-mix(in srgb,currentColor 46%,transparent),transparent 72%);
  box-shadow:inset 0 0 15px color-mix(in srgb,currentColor 28%,transparent),
             0 0 24px color-mix(in srgb,currentColor 45%,transparent);
}
.section-art span:nth-child(2){transform:rotate(45deg) translate(0,0);opacity:.65}
.section-art span:nth-child(3){transform:rotate(45deg) translate(16%,-16%);opacity:.4}
[data-section="words"] .section-art span{border-radius:50% 50% 50% 9%;transform:rotate(-25deg) translate(-29%,2%)}

[data-section="words"] .section-art span:nth-child(3){transform:rotate(64deg) translate(24%,-3%)}
[data-section="idioms"] .section-art span{border-radius:50%;transform:translateX(-34%)}
[data-section="idioms"] .section-art span:nth-child(2){transform:translateX(24%)}
[data-section="idioms"] .section-art span:nth-child(3){transform:translateY(-27%) scale(.72)}
[data-section="phrases"] .section-art span{border-radius:40% 40% 9% 40%;transform:rotate(-14deg) translate(-28%,-15%)}
[data-section="phrases"] .section-art span:nth-child(2){transform:rotate(12deg) translate(29%,23%)}

    {"term": "born with a silver spoon in one's mouth", "meaning": "Born rich, or into a wealthy family.", "example": "He was born with a silver spoon in his mouth and probably never had to work a day in his life."},

    {"term": "hold one's tongue", "meaning": "To refrain from talking about something.", "example": "I don't like his political ideas, but I will hold my tongue."},
    {"term": "until one is blue in the face", "meaning": "For a hopelessly long time; used especially in respect to discussing, explaining, insisting, etc.", "example": "You can explain it until you're blue in the face, but he will never understand."},
    {"term": "what is more", "meaning": "Used to introduce a statement which builds on the preceding statement, but expresses a stronger sentiment.", "example": "I've done it wrong, and what's more, I don't care."},

    {"term": "turn into a pumpkin", "meaning": "To go to bed; to go to sleep (especially at, or around midnight).", "example": "I'm about ready to turn into a pumpkin. You can stay up later if you want.", "register": "Розмовне вживання"},
    {"term": "hit the nail on the head", "meaning": "To identify something exactly; to arrive at exactly the right answer.", "example": "He hit the nail on the head when he said the problem was the thermostat."},

    {"term": "more often than not", "meaning": "Usually; more than half the time; more likely to be the case than not to be the case.", "example": "More often than not, tomato seeds will sprout even if they are a couple of years old."},

    {"term": "hit the road", "meaning": "To begin traveling in an automobile or other road vehicle.", "example": "If we're gonna make it by sunset, we'd better hit the road."},

    {"term": "get someone's goat", "meaning": "To annoy or infuriate someone.", "example": "It really gets my goat when inconsiderate people drop litter in public.", "register": "Неформальне вживання"},

    {"term": "piece of cake", "meaning": "A job, task or other activity that is pleasant or, by extension, easy or simple.", "example": "Sure, no problem. It'll be a piece of cake."},
    {"term": "take a breather", "meaning": "To take a break; to pause or relax briefly.", "example": "Why don't we stop and take a breather before we continue?"},

    {"term": "all the tea in China", "meaning": "Something very valuable or priceless.", "example": "I wouldn't trade you away for all the tea in China."},
    {"term": "bend over backwards", "meaning": "To make a great effort; to take extraordinary care; to go to great lengths.", "example": "They bent over backwards to make sure everything was just right for the visit.", "register": "Неформальне вживання"},

    {"term": "above and beyond", "meaning": "Further than; doing more than is expected or required.", "example": "The hospital staff often go above and beyond what is required of them."},

    {"term": "out of line", "meaning": "Inappropriate or unsuitable, especially by reason of being unmannerly or indelicate.", "example": "I hope my comments yesterday were not out of line."},

    {"term": "as the crow flies", "meaning": "In a straight line distance between two locations, as opposed to the road distance or over land distance.", "example": "It is 15 kilometers as the crow flies."},

    {"term": "beat a dead horse", "meaning": "To persist or continue far beyond any purpose, interest or reason.", "example": "After having shown us three hours of instructional and safety videos, the inspector was simply beating a dead horse by telling us to buckle up as we got into the van."},

    {"term": "burst someone's bubble", "meaning": "To disillusion; to disabuse someone of a false notion or rationalization that has grown comfortable.", "example": "I hate to burst his bubble, but he is going to be disappointed if he tries that idea.", "register": "Неформальне вживання"},

    {"term": "keep someone posted", "meaning": "To inform (someone) regularly of the latest developments.", "example": "That's all the news for now, but I'll keep you posted about new developments."},

    {"term": "for the most part", "meaning": "In most aspects; mostly; generally.", "example": "For the most part, the crowd was orderly."},
    {"term": "up to scratch", "meaning": "sufficient; adequate; of acceptable or satisfactory quality", "example": "They decided that his performance was not up to scratch."},
    {"term": "red letter day", "meaning": "A particularly significant day; a day of personal or sectarian celebration.", "example": "Monday was a red letter day for her. She accomplished a lot and had fun doing it."},
    {"term": "top it off", "meaning": "To emphasize or underscore; to make something even better or worse.", "example": "The boss fired Fred and, to top it all off, he asked security to escort him to the door."},
    {"term": "keep tabs on", "meaning": "To monitor; to keep track of; to watch.", "example": "If you are careful to keep tabs on your finances, you should be able to stay within a budget."},
    {"term": "draw the short straw", "meaning": "To be selected to do an undesirable task (by drawing the shortest straw or otherwise).", "example": "I drew the short straw and got stuck doing the whole project alone."},
    {"term": "whoop it up", "meaning": "To have a great time; to party or revel whole-heartedly or noisily.", "example": "They all went out to whoop it up on his 21st birthday."},
    {"term": "behind the scenes", "meaning": "behind the scenery and stage area; backstage; among the actors; during the production or rehearsal", "example": "Many videos come with features that show what went on behind the scenes to make the movie and special effects."},
    {"term": "best of both worlds", "meaning": "A combination of two seemingly contradictory benefits.", "example": "That movie was both hilarious and touching; it was the best of both worlds."},
    {"term": "burn the midnight oil", "meaning": "To work studiously, especially late into the night.", "example": "He was burning the midnight oil to finish his paper."},
    {"term": "out of touch", "meaning": "No longer maintaining contact or communications.", "example": "I had been out of touch with my old friend for a long time when she called."},
    {"term": "ham it up", "meaning": "To deliberately exaggerate one's emotions or movements, or to overact or act hammily.", "example": "You can count on him to ham it up for the camera."},
    {"term": "at the mercy of", "meaning": "In the power of; defenceless/defenseless against.", "example": "The ball game is scheduled for Saturday, but we're still at the mercy of the weather."},
    {"term": "up to speed", "meaning": "Fully informed; current.", "example": "Is Mary up to speed on the situation in Kuala Lumpur?"},
    {"term": "take it away", "meaning": "To begin, especially to launch a performance of some sort.", "example": "I'd like to introduce Mumbo the Magnificent and his dancing parrot, Tiddles. Take it away, Mumbo!"},
    {"term": "take the mickey", "meaning": "To ridicule or mock someone; to make fun of someone.", "example": "Are you takin’ the mickey? You’ll get yer ’ead bashed in."},
    {"term": "it takes two to tango", "meaning": "Some things need the active cooperation of two parties; blame is to be laid on both parties in a conflict.", "example": "I can't do it by myself, and neither can you – it takes two to tango."},
    {"term": "so long as", "meaning": "Depending upon some condition or requirement; provided that; if, assuming; as long as.", "example": "I don't mind if he stays there, so long as he cleans up after himself when he's done."},
    {"term": "as long as", "meaning": "Provided that, if, assuming (depending upon some condition or requirement).", "example": "I don't mind if he stays there, as long as he cleans up after himself when he's done."},
    {"term": "outside the box", "meaning": "Beyond the bounds of convention or normal practice.", "example": "The boss wants some new ideas—it's time to think outside the box."},
    {"term": "drop in the bucket", "meaning": "Something of little importance, especially an inconsequential effort or action as compared to a huge problem.", "example": "A $100 donation from an individual is generous, but it is a drop in the bucket compared to the $100,000 fundraising goal."},
    {"term": "roll out the red carpet", "meaning": "To extend the utmost hospitality; to treat someone as an honored guest; to welcome or host, especially in a showy or extravagant manner.", "example": "The mayor of the little town rolled out the red carpet for new businesses by calling on them personally.", "register": "Неформальне вживання"},
    {"term": "twiddle one's thumbs", "meaning": "To wait or dawdle; to accomplish nothing useful or lack a useful occupation.", "example": "He twiddled his thumbs for almost a week while he waited for somebody to set up his computer."},
    {"term": "kiss of death", "meaning": "Something that may seem good and favorable but that actually brings ruin to hopes, plans, etc.", "example": "The role in the soap opera was the kiss of death for Ann's career as a theatrical actress.", "register": "Неформальне вживання"},
    {"term": "kiss of life", "meaning": "Mouth-to-mouth resuscitation.", "example": "The lifeguard pulled the man out of the lake and gave him the kiss of life."},
    {"term": "pound the pavement", "meaning": "To travel on foot; to walk or run.", "example": "The joggers pounded the pavement for several miles each day."},
    {"term": "in the works", "meaning": "Being planned or worked upon.", "example": "They always have some wonderful new project in the works."},
    {"term": "behind someone's back", "meaning": "Without somebody's knowledge; secretly.", "example": "The employees talked about their boss behind his back."},
    {"term": "all over the place", "meaning": "In multiple directions or locations, often haphazardly; everywhere.", "example": "They started firing all over the place."},
    {"term": "catch a falling knife", "meaning": "To buy a financial instrument whose price is falling rapidly.", "example": "Buying that stock now would be catching a falling knife. Wait until you see capitulation."},
    {"term": "change of heart", "meaning": "A change of one's opinion, belief or decision.", "example": "He quit work on Friday, but on Monday he had a change of heart and decided to come back."},
    {"term": "leave someone in the lurch", "meaning": "To abandon somebody; especially, to abandon somebody and leave them in a difficult situation.", "example": "He left me in the lurch and I had to finish the whole project by myself."},
    {"term": "hole in one", "meaning": "Any rare, wonderful, or remarkable accomplishment.", "example": "If we can get the entire thing moved over in a day, it'll be a hole in one with the customer."},
    {"term": "here goes nothing", "meaning": "Indicates a lack of confidence or certainty about the activity about to be tried, but that it will be attempted nonetheless.", "example": "Well, I checked everything and I think it's wired up correctly, so I guess all that's left is to turn it on. Here goes nothing!"},
    {"term": "off the deep end", "meaning": "Crazy, erratic, or irrational.", "example": "It used to be a funny comic, but lately it has gone off the deep end."},
    {"term": "hide nor hair", "meaning": "A trace, indication, or evidence, especially of a person.", "example": "He retired last June, and his coworkers have seen neither hide nor hair of him since."},
    {"term": "through the roof", "meaning": "Having risen to a very high level or amount.", "example": "Fuel prices have gone through the roof since last fall."},
    {"term": "bite off more than one can chew", "meaning": "To try to do too much; to take on or attempt more than one is capable of doing.", "example": "I think I bit off more than I could chew when I agreed to paint this house by myself."},
    {"term": "from the get-go", "meaning": "From the very beginning; from the outset; immediately upon starting.", "example": "I watched him closely from the get-go because I did not trust him.", "register": "Розмовне вживання"},
    {"term": "on the spot", "meaning": "At that very moment.", "example": "He liked the house, so he made an offer on the spot."},
    {"term": "take the cake", "meaning": "Used as an affirmation or accolade of someone occupying the top rank in a comparison or contest; to win or be the best (at).", "example": "Thanks! You guys take the cake.", "register": "Розмовне вживання"},
    {"term": "no two ways about it", "meaning": "No other possible action, choice or option.", "example": "There are no two ways about it. We'll have to start over from the very beginning."},
    {"term": "shake a leg", "meaning": "To get busy; to get going; to be productive.", "example": "Shake a leg! We haven't got all day."},
    {"term": "nothing to it", "meaning": "Easy; simple or straightforward.", "example": "See? Nothing to it. You just put tab A in slot B and give it a flip."},
    {"term": "give the time of day", "meaning": "To acknowledge someone; to give someone respect or attention; to tip one's hat.", "example": "If you're lucky, she might give you the time of day."},
    {"term": "keep an eye peeled", "meaning": "To look out (for something) attentively.", "example": "Keep an eye peeled, you never know when the ice-cream truck will pass by."},
    {"term": "get rid of", "meaning": "To rid oneself of; to cause oneself to be free of or released from.", "example": "Over the weekend he spent some time getting rid of the clothes he no longer wears."},
    {"term": "leave someone high and dry", "meaning": "To abandon somebody; to stop providing assistance at a crucial moment.", "example": "He just walked out and left her high and dry with two kids and a mortgage."},
    {"term": "frog in one's throat", "meaning": "Hoarseness or the need to cough.", "example": "I had a frog in my throat and the words didn't come out very clearly."},
    {"term": "long time no see", "meaning": "I (or we) have not seen you for a long time.", "example": "Dave! Long time no see! How’s Boston been treating you?"},
    {"term": "at arm's length", "meaning": "Avoiding a close relationship.", "example": "She's been keeping me at arm's length all the time. She doesn't want to get involved."},
    {"term": "in front of one's nose", "meaning": "Plain; clearly apparent; obvious.", "example": "All that time we've been searching for the answer, and it was right in front of our noses."},
    {"term": "hand over fist", "meaning": "Quickly or in great quantity, especially in reference to earning money.", "example": "to make money hand over fist"},
    {"term": "the other day", "meaning": "Recently; lately; a few days ago.", "example": "I saw your friend William the other day. He says hi."},
    {"term": "give someone the slip", "meaning": "To evade, escape, or get away from somebody.", "example": "The police chased the suspect for two days before he finally gave them the slip and vanished."},
    {"term": "leave someone to their own devices", "meaning": "to leave alone, unsupervised, without assistance.", "example": "Left to my own devices, I'll spend hours staring into space, just thinking."},
    {"term": "stand one's ground", "meaning": "To maintain or adhere to an opinion or position; to remain resolute in the face of opposition.", "example": "They expect their opponents to stand their ground on the issue."},
    {"term": "with flying colors", "meaning": "Very successfully; in an exceptional, noteworthy, or extraordinary manner.", "example": "He passed the test with flying colors, as everyone had expected."},
    {"term": "in your face", "meaning": "A derisive and contemptuous exclamation of triumph over one's interlocutor.", "example": "I got picked for the cheerleading squad, and YOU didn't. In your face!"},
    {"term": "for the time being", "meaning": "Temporarily; for now; until later; until the situation changes; in an indefinite period of time.", "example": "I think I will ignore the problem for the time being."},
    {"term": "in a nutshell", "meaning": "In summary; briefly or simply.", "example": "He had a lot to say, but his answer, in a nutshell, was no."},
    {"term": "have one's hands full", "meaning": "To be busy or thoroughly preoccupied.", "example": "He already has his hands full with two kids and a full-time job, yet he still makes time to volunteer."},
    {"term": "have a ball", "meaning": "To enjoy oneself thoroughly; to have lots of fun or excitement.", "example": "The kids had a ball playing in the fountain."},
    {"term": "get off lightly", "meaning": "To end up with a mild punishment, or without serious harm.", "example": "My cousin got off lightly with a restraining order after he broke the boy’s leg."},
    {"term": "on one's high horse", "meaning": "Self-righteous; proceeding on the belief one is more correct or proper than others.", "example": "When she gets on her high horse there is not much to do but go along with it or wait for it to pass."},
    {"term": "take no notice of", "meaning": "To ignore.", "example": "He took no notice of the spider until it bit him."},
    {"term": "apples and oranges", "meaning": "A comparison of items that, however categorically similar, is inapt; an incompatible analogy, or the items so compared; a disanalogy.", "example": "It's apples and oranges. You can't convert square meters to linear inches."},
    {"term": "handle with kid gloves", "meaning": "To treat (a person or a subject) very delicately or carefully, especially so as not to cause offense or controversy.", "example": "The campaign staff cautioned the candidate to handle the issue with kid gloves."},
    {"term": "stand the test of time", "meaning": "To remain useful or valued over a long period of time; to last a long time.", "example": "Pop music comes and goes, but classical music has stood the test of time."},
    {"term": "neck and neck", "meaning": "Very close in progress, as in a race or a contest.", "example": "The polls suggest that the candidates were neck and neck in the election."},
    {"term": "month of Sundays", "meaning": "A very long time; a period regarded as too long.", "example": "It seems like it’s been a month of Sundays since we saw him last.", "register": "Неформальне вживання"},
    {"term": "way out of a paper bag", "meaning": "A minimal level of competence or effectiveness, as used in phrases where one is unable to perform.", "example": "My boss is so clueless, he couldn't schedule his own way out of a paper bag."},
    {"term": "go off half-cocked", "meaning": "To take a premature or ill-considered action.", "example": "Make sure none of your men go off half-cocked and ruin this operation.", "register": "Розмовне вживання"},
    {"term": "bark up the wrong tree", "meaning": "To take the wrong approach to a situation; to follow a false lead; to attempt to solve a problem using mistaken assumptions about its true nature.", "example": "The investigator spent days trying to prove the butler committed the murder, but it turns out he was barking up the wrong tree."},
    {"term": "off the top of one's head", "meaning": "In an extemporaneous manner; without careful thought, preparation, or investigation.", "example": "I cannot think of any good examples off the top of my head, but give me a couple of hours and I'm sure I could come up with something."},
    {"term": "go back to the drawing board", "meaning": "To start again; to scrap a previous idea or plan and try again from the beginning.", "example": "After the original plan failed miserably, they decided to go back to the drawing board and come up with something new."},
    {"term": "make a mountain out of a molehill", "meaning": "To treat a problem as greater than it is; to blow something out of proportion; to exaggerate the importance of something trivial.", "example": "If you’re stuck in traffic, try not to make a mountain out of a molehill worrying about it too much. You could be making it much worse."},
    {"term": "team up with", "meaning": "To associate with another in a joint enterprise.", "example": "The ice cream shop teamed up with the cookie and brownie place next door to create wonderful sundaes."},
    {"term": "give someone a piece of one's mind", "meaning": "To express one's opinion strongly; to voice one's disagreement or dissatisfaction, especially with another person; to scold or rebuke someone.", "example": "That is the fourth time this week my neighbor's barking dog has woken me up. I'm going to go give her a piece of my mind about it."},
    {"term": "you name it", "meaning": "All kinds of things; expresses that further examples are unnecessary, often after a short list of items.", "example": "There were ducks, geese, swans, you name it on the lake.", "register": "Неформальне вживання"},
    {"term": "move the goalposts", "meaning": "To alter the terms of an agreement or an agreed target, or the rules of a negotiation while it is ongoing, especially in an unfair way.", "example": "This is a Government that meets its economic targets and does not move the goalposts."},
    {"term": "nothing to write home about", "meaning": "Not exceptional; not noteworthy or especially good.", "example": "The vegetables were okay, but the soup was nothing to write home about."},
    {"term": "go against the grain", "meaning": "To defy convention or norms; to do something in a manner that is unusual or out of the ordinary.", "example": "His method certainly goes against the grain, but it is unquestionably effective."},
    {"term": "tit for tat", "meaning": "Equivalent retribution; an act of returning exactly what one gets; an eye for an eye.", "example": "If you hit me, I’ll hit you back; tit for tat."},
    {"term": "at full tilt", "meaning": "At full speed; very quickly.", "example": "Don't go racing around corners at full tilt or you'll hit someone."},
    {"term": "behind the eight-ball", "meaning": "In a difficult situation or tight spot; at a disadvantage.", "example": "After his last two projects failed, he was really behind the eight-ball."},
    {"term": "needle in a haystack", "meaning": "Something that is difficult or impossible to locate.", "example": "You'll never find the paper you need on her desk. You're looking for a needle in a haystack."},
    {"term": "in the cards", "meaning": "Destined or fated to happen; predicted or foreseen.", "example": "I don't think another child is in the cards for them."}
  ],
  "phrases": [
    {"term": "aw shucks", "meaning": "An expression of bashfulness or modesty, especially in response to a compliment or when giving thanks.", "example": "Aw shucks, you're going to make me blush.", "register": "Розмовне вживання"},
    {"term": "buzz off", "meaning": "go away.", "example": "The bouncer shouted “Buzz off!” and kicked me out of the establishment.", "register": "Розмовне вживання"},
    {"term": "chin up", "meaning": "Be happy; cheer up.", "example": "Chin up: it’s your birthday.", "register": "Розмовне вживання"},
    {"term": "ding dong", "meaning": "The sound made by a bell; especially, that made by a doorbell.", "example": "Ding dong bell, pussy's in the well! / Who put her in? Little Johnny Thin. / Who pulled her out? Little Tommy Stout.", "register": "Розмовне вживання"},
    {"term": "do what", "meaning": "An intensified version of what? or huh?, expressing surprise or lack of comprehension", "example": "\"The throbulator is connected via the tertiary wiring loom.\"' — \"Do what??\"", "register": "Розмовне вживання"},
    {"term": "full stop", "meaning": "Used to emphasize the end of an important statement or point when speaking to show something is not up for discussion or debate.", "example": "We need more people to join IRC, full stop.", "register": "Розмовне вживання"},
    {"term": "get it", "meaning": "Do you understand? Have you heard? (after explaining or giving an order)", "example": "Don't ever touch my computer. Get it?", "register": "Розмовне вживання"},
    {"term": "hey presto", "meaning": "Indicates a sudden desirable conclusion or change, as if by magic", "example": "If you take the next left, you’ll see a big shop and hey presto, you’re there.", "register": "Розмовне вживання"},
    {"term": "it's on", "meaning": "A conflict or competition is starting or has just started.", "example": "Oh, it's on now, for sure. Those boys are about to get smoked real good.", "register": "Розмовне вживання"},
    {"term": "let's go", "meaning": "Hurry up; be quick.", "example": "Let's go, practice starts in five minutes.", "register": "Розмовне вживання"},
    {"term": "mission accomplished", "meaning": "Used to express that a task, or set of tasks, has been completed.", "example": "I just finished wrapping up the presents. Mission accomplished! Now for the next thing...", "register": "Розмовне вживання"},
    {"term": "my bad", "meaning": "My fault; mea culpa.", "example": "Yes, I realise the car isn't supposed to be parked in the heirloom flowerbed. My bad.", "register": "Розмовне вживання"},
    {"term": "no duh", "meaning": "An expression or exclamation that something is exceedingly obvious or apparent, or that one would have to be extremely foolish not to realize something immediately.", "example": "It says here not to drive with the sun shade covering the windshield of your car. No duh!", "register": "Розмовне вживання"},
    {"term": "not even", "meaning": "Used to express strong disappointment or disapproval.", "example": "I heard they wanted to cancel the show tonight. – Not even!", "register": "Розмовне вживання"},
    {"term": "oh boy", "meaning": "An expression of delight or joy.", "example": "Oh, boy! I can't wait to tell my friends about this!", "register": "Розмовне вживання"},
    {"term": "oh yeah", "meaning": "Used to indicate agreement, often sarcastically.", "example": "Are you going to the party? — Oh, yeah!", "register": "Розмовне вживання"},
    {"term": "on at", "meaning": "Continually scolding or badgering (a person).", "example": "John's been on at me to donate to his crowdfunder.", "register": "Розмовне вживання"},
    {"term": "say again", "meaning": "\"What did you say?\" or \"Repeat what you have said.\" A polite formula used when one has not heard or understood what has been said.", "example": "I'm sorry, I didn't hear you. Please say again?", "register": "Розмовне вживання"},
    {"term": "says who", "meaning": "Who says so; on whose authority?", "example": "— All of this is mine now. — Says who?", "register": "Розмовне вживання"},
    {"term": "shut up", "meaning": "I don't believe it!, no way!", "example": "I got accepted to Yale! —Shut up, really? That's awesome!", "register": "Розмовне вживання"},
    {"term": "what gives", "meaning": "What is wrong? Why is this happening?", "example": "Not even thirty minutes after leaving the shower, my head starts itching. What gives?", "register": "Розмовне вживання"},
    {"term": "what's good", "meaning": "What is good, especially in reference to food.", "example": "What's good here? I'm way too indecisive to choose from a menu.", "register": "Розмовне вживання"},
    {"term": "what's up", "meaning": "What’s the matter? What is the problem? What is wrong?", "example": "You're looking a bit miserable. What's up?", "register": "Розмовне вживання"},
    {"term": "what's with", "meaning": "What is wrong with.", "example": "What's with Jim lately? He always has a frown on his face.", "register": "Розмовне вживання"},
    {"term": "work it", "meaning": "An approving description of anyone demonstrating skilful use of anything.", "example": "Everyone on the crew is good with a trowel, but damn that guy is really workin it today.", "register": "Розмовне вживання"},
    {"term": "and a half", "meaning": "An intensifier, used to emphasize great extent or degree.", "example": "That guy was an idiot and a half.", "register": "Розмовне вживання"},
    {"term": "and then some", "meaning": "Used to confirm preceding utterance, while implying that what was said or asked is an understatement.", "example": "It created a disruption, and then some.", "register": "Розмовне вживання"},
    {"term": "as you do", "meaning": "Used to indicate unusual or unexpected behavior.", "example": "I bought a dozen melons before heading home, as you do.", "register": "Розмовне вживання"},
    {"term": "but who's counting", "meaning": "Used as a retort or comeback, often to deprecate oneself or another for excessive concern or attention to detail.", "example": "There are only 258 more shopping days until Christmas, but who's counting?", "register": "Розмовне вживання"},
    {"term": "coming from you", "meaning": "Used as an answer to somebody whom the speaker thinks is being hypocritical.", "example": "Why are you so grumpy? – Coming from you!", "register": "Розмовне вживання"},
    {"term": "dogs are barking", "meaning": "Feet hurt (are achy or in pain; usually from a lot of walking or other exertion).", "example": "A busy shift with no chance to sit down even once. My dogs are barking!", "register": "Розмовне вживання"},
    {"term": "don't look now", "meaning": "Used to point out something the speaker feels is obvious.", "example": "Oh, yeah? Well, don't look now, but we're on the grass!", "register": "Розмовне вживання"},
    {"term": "dot dot dot", "meaning": "As if adding an ellipsis in the middle of speech, indicates a pause, an omission or an unfinished thought.", "example": "Let me read this part of the note for the court reporter: \"Either meet my demands or dot dot dot.\"", "register": "Розмовне вживання"},
    {"term": "ears are burning", "meaning": "Being the topic of discussion in another place; or sensing that this is happening.", "example": "His ears are burning.", "register": "Розмовне вживання"},
    {"term": "far far away", "meaning": "Used to add emphasis to the fact that the story takes place in a far away land.", "example": "Long long ago, in a land far far away there lived a beautiful princess.", "register": "Розмовне вживання"},
    {"term": "hold one's fire", "meaning": "Wait, don't retaliate, calm down, be quiet.", "example": "Hold your fire and let me explain.", "register": "Розмовне вживання"},
    {"term": "it's all go", "meaning": "Things are progressing busily; a great deal is happening.", "example": "It's all go around here: Jo's about to get married, and Dave has a new job.", "register": "Розмовне вживання"},
    {"term": "it's no use", "meaning": "Used to indicate that the specified action cannot succeed or offers no advantage if successful", "example": "It's no use trying to push the car out of the ditch; the axle is broken.", "register": "Розмовне вживання"},
    {"term": "let's face it", "meaning": "Said about something said to be true (esp. an unpleasant truth); to admit something; often without \"let's\".", "example": "Face it. \"It's raining cats and dogs\" is an absurd yet evocative expression.", "register": "Розмовне вживання"},
    {"term": "long long ago", "meaning": "Used to add emphasis to the fact that the story takes place in the distant past.", "example": "Long long ago, in a land far far away there lived a beautiful princess.", "register": "Розмовне вживання"},
    {"term": "not saying much", "meaning": "Nothing impressive.", "example": "Sure, he has a wife and kids, but that's not saying much when they're separated and he hasn't seen them in years.", "register": "Розмовне вживання"},
    {"term": "say you swear", "meaning": "Expresses disbelief.", "example": "You're rich? Say you swear!", "register": "Розмовне вживання"},
    {"term": "tell you what", "meaning": "Introduces a compromise or arrangement where the interlocutor has some benefit or advantage.", "example": "Tell you what, you can have it for fifty quid if you'll promise to give it a good home.", "register": "Розмовне вживання"},
    {"term": "than a bygod", "meaning": "Used with a comparative to express extreme heat or cold.", "example": "It's colder than a bygod out there!", "register": "Розмовне вживання"},
    {"term": "that's the thing", "meaning": "Used to seize on a point and highlight its comparative importance, especially as a refutation or negation to a statement made by another speaker.", "example": "But that's the thing, see? Like you said, you can't just go spending your money like that.", "register": "Розмовне вживання"},
    {"term": "the thing is", "meaning": "Used to shift focus to an overriding point or impediment.", "example": "I'd like to come, but the thing is, I just can't afford it.", "register": "Розмовне вживання"},
    {"term": "there's no use", "meaning": "Used to indicate that the specified action cannot succeed or offers no advantage if successful", "example": "There's no use trying to tell him; he won't listen.", "register": "Розмовне вживання"},
    {"term": "wait for it", "meaning": "Used to draw attention to and build suspense, often ironically, for a remark to come.", "example": "I just found out that my ex-wife, who never wanted children, now has two kids called, wait for it, Ludwig and Balthazar.", "register": "Розмовне вживання"},
    {"term": "waiting to happen", "meaning": "Bound to happen; almost certain to occur in the future.", "example": "an accident waiting to happen, a divorce waiting to happen", "register": "Розмовне вживання"},

  "As a therapist sometimes you have to step back from your clients' lives.": "Як терапевт, іноді потрібно відступити від життя своїх клієнтів.",
  "As if the hostile takeover weren't enough, to add insult to injury they scrapped ninety percent of our products and replaced them with their own.": "Якби ворожеского захопу не було достатньо, щоб додати оскорблення до травм вони скинули дев'ятдесят відсотків наших продуктів і замінили їх своїми.",
  "As long as you get the vice president's approval first, it'll be a slam dunk.": "Якщо ви спочатку отримаєте схвалення віце-президента, це буде крах.",
  "As soon as I walked into that party I thought, \"I'm not in Kansas anymore.\"": "Як тільки я вийшла на вечірку, я подумала: \"Я вже не в Канзасі\".",
  "As the train rushed through, thousands of birds took to the air at once.": "Коли поїзд проїхав, тисячі птахів відразу пішли в повітря.",
  "At first it seemed like a good idea, but now that it's getting close I'm having second thoughts.": "Спочатку це здавалося хорошою ідеєю, але тепер, коли вона наближається, я передумую.",
  "At first, the suspect would not tell us anything about the other participants in the crime. But after being offered a deal, he spilled his guts.": "Спочатку підозрюваний не розповів нам про інших учасників злочину, але після того, як йому запропонували угоду, він розлив свої кишки.",
  "At the conference, they laid on a wonderful buffet.": "На конференції вони заклали чудовий буфет.",
  "Aw shucks, you're going to make me blush.": "О, боже, ти змусиш мене зачервоти.",
  "Back up the car a little, you're blocking the driveway.": "Поверніть машину трохи, ви заблокуєте підхід.",
  "Back up your documents folder before applying the update.": "Копіюйте папку документів перед застосуванням оновлення.",
  "Be sure to put up the tools when you finish.": "Переконайтеся, що складите інструменти, коли закінчите.",
  "Be sure to speak for a seat early, if you plan to attend.": "Будьте впевнені, що ви поговорите за місцем раніше, якщо плануєте відвідати.",
  "Bear in mind that I’m not as young as I was, so I can’t walk as fast as you.": "Пам'ятайте, що я не такий молодий, як я був, тому я не можу ходити так швидко, як ви.",
  "Beethoven is probably turning in his grave at the way that rock group mangled his Ninth Symphony.": "Бетховен, ймовірно, перевертається в могилу так, як рок-група зруйнувала його дев'яту симфонію.",
  "Before agreeing to volunteer, she asked, “What’s in it for me?”": "Перед тим, як погодитися на волонтерство, вона запитала: \"Що мені з цього?\"",
  "Before paying any money, make sure the organization is on the up-and-up.": "Перед тим, як сплатити гроші, переконайтеся, що організація добре розрахована.",
  "Before we start the project, let's just run over who is doing what.": "Перед тим, як почати проект, давайте просто проверимо, хто що робить.",
  "Biking to work kills two birds with one stone. It saves money travelling and will help to lose weight.": "Велосипед на роботу вбиває двох птахів одним кам'яном. Це заощадить гроші на подорожі і допоможе схуднути.",
  "Break out the bubbly and celebrate.": "Вирвіть бульбу і святкуйте.",
  "But that's the thing, see? Like you said, you can't just go spending your money like that.": "Як ти казав, ти не можеш просто так витрачати гроші.",
  "Buying that stock now would be catching a falling knife. Wait until you see capitulation.": "Купивши цю акцію зараз, це було б випавши нож.",
  "By going against the grain and going to work nude, you've made yourself a laughing stock.": "Якщо ти підеш проти закону і працюєш голим, ти зробиш себе сміхом.",
  "By subscribing to this magazine, you can stay plugged in to current issues.": "Запишуючись на цей журнал, ви зможете продовжувати читати сучасні видання.",
  "By the eighth mile, I was sure that finishing the 10-mile hike would do me in.": "До восьмої милі я був впевнений, що закінчуючи прогулянку 10 миль, я зможу потрапити.",
  "Can we cut through the bureaucracy and make a decision on the spot?": "Чи можемо ми перервати бюрократію і прийняти рішення тут же?",
  "Can you believe somebody would just run over a cat like that?": "Ви можете повірити, що хтось так просто перекинув кішку?",
  "Can you drop the kids off at school?": "Ти можеш відвезти дітей до школи?",
  "Can you pull over just after the post office? My house is next door.": "Ви можете зупинитися відразу після пошти?",
  "Can you run it back to the beginning, please?": "Ви можете повернути його до початку, будь ласка?",
  "Can you sit in for him while he's gone?": "Ти можеш замінити його, поки він не буде?",
  "Chalk it up to fear that he didn't finish.": "Зверніть його на страх, що він не закінчив.",
  "Children and Television; The One Eyed Monster? - Barrie Gunter, Jill McAleer; 1990": "Діти і телебачення; Однооче чудовисько? - Баррі Гюнтер, Джилл Маклеер; 1990",
  "Children who do not receive enough attention may begin to play up.": "Діти, які не отримують достатньої уваги, можуть починати грати.",
  "Chin up: it’s your birthday.": "Голова вгору: це твої дні народження.",
  "Cindy is going to make over Karen tomorrow.": "Сінді завтра переправить Карен.",
  "Come on, seven! I need a seven! Baby needs new shoes!": "Ну ну ну ну ну ну ну ну ну ну ну ну ну ну ну ну ну ну ну ну ну ну ну ну ну ну ну ну ну ну ну ну ну ну ну ну ну ну ну",
  "Come to think of it, it's curious that nobody was there.": "Якщо подумати про це, дивно, що там ніхто не був.",
  "Company lawyers told him to walk away from the deal.": "Адвокати компанії сказали йому відмовитися від угоди.",
  "Could you back off the volume a bit? It’s really loud.": "Чи не могли б ви трохи знизити громкість?",
  "Could you please give me a hand carrying this mattress?": "Ви можете, будь ласка, допомогти мені нести цей матрас?",
  "Could you speak up? I can't hear you.": "Ви можете говорити глибше? Я вас не чую.",
  "Dave and I fell out after a long argument.": "Ми з Дейвом розпали після довгої суперечки.",
  "Dave asked the new girl to the dance but he struck out.": "Дэйв запросив нову дівчину на танці, але він відмовився.",
  "Dave! Long time no see! How’s Boston been treating you?": "Дейв, давно не бачив! Як Бостон з тобою ставиться?",
  "Did you see how she waits on him hand and foot? It's not healthy.": "Ви бачили, як вона чекає на нього на руках і ногах?",
  "Ding dong bell, pussy's in the well! / Who put her in? Little Johnny Thin. / Who pulled her out? Little Tommy Stout.": "Дінгдон Белл, кучка в колоді! Хто її вставив? Маленький Джонні Тін. / Хто її витягнув? Маленький Томі Стоут.",
  "Divorcing my wife cost me a small fortune.": "Розлучення з дружиною коштувало мені невеликого багатства.",
  "Do not show colour to me!": "Не покажіть мені кольору!",
  "Do the early results say our candidate will get in?": "Чи ранні результати свідчать про те, що наш кандидат отримає участь?",
  "Do you mind if I pull up on you in about half an hour?": "Ви не против, якщо я прийду до вас через півгодини?",
  "Do you really need a fancy new car or are you just trying to keep up with the Joneses?": "Вам дійсно потрібна новинна машина або ви просто намагаєтеся догонятися до Джонеса?",
  "Do you think they can get by on only one salary?": "Думаєте, вони можуть вижити лише за одну зарплату?",
  "Do you think we could get away with taking Dad’s car?": "Думаєш, ми зможемо вирватися з того, щоб забрати машину батька?",
  "Does it take an act of Congress just to get a stop sign on a corner?": "Чи потрібен акт Конгресу тільки для того, щоб отримати знак \"стоп\" на куті?",
  "Doing volunteer work to help others is truly worth one's while.": "Використовуючи добровільну роботу, щоб допомогти іншим, дійсно варто витратити час.",
  "Don't ever touch my computer. Get it?": "Ніколи не торкайтеся мого комп'ютера.",
  "Don't forget that this Sunday we put the clocks back an hour.": "Не забувай, що в неділю ми відклали годинники на годину.",
  "Don't go in there...I really blew it up.": "Не заходь туди. Я там добряче напердів.",
  "Don't go racing around corners at full tilt or you'll hit someone.": "Не гоніться навколо кутів на повній схильності, інакше ти вдариш когось.",
  "Don't hold back. Hit it as hard as you can.": "Не тримайся, побій так сильно, як можеш.",
  "Don't mess with the controls. I just got everything adjusted correctly.": "Не заплутайся з керівниками, я все правильно налаштував.",
  "Don't push in! Go to the back of the queue!": "Не натисніть, ідіть на задній черг!",
  "Don't set him off or he won't shut up all day.": "Не підштовхуй його, інакше він не замовляє весь день.",
  "Don't take it out on your husband if you had trouble with your boss at work.": "Не викарай на чоловіка, якщо у тебе були проблеми з боссом на роботі.",
  "Don't take it personally when he shouts like that. He's just blowing off steam.": "Не сприймай його особисто, коли він так кричить.",
  "Don't you sling off at me anymore!": "Ти більше не кидайся на мене!",
  "Driving 300 miles on one tank of gas was cutting it close, but we arrived safely.": "Водівши 300 миль на одній резерворі бензину, ми наблизилися, але ми прибули в безпеці.",
  "Even though money is scarce sometimes, Ann stands by her decision to be a full-time mother.": "Незважаючи на те, що іноді грошей не вистачає, Анн дотримується свого рішення стати матір'ю на повний робочий день.",
  "Even though the concept is new to public scrutiny, pundits recognize that the web celeb archetype is profoundly affecting conventional media.": "Незважаючи на те, що ця концепція нова для громадського обстеження, експерти визнають, що архетип веб-знавців глибоко впливає на звичайні медіа.",
  "Ever since his promotion, they’ve been living high on the hog.": "З тих пір, як він був підвищений, вони живуть на висоті.",
  "Every year he resolves to turn over a new leaf and start exercising.": "Щороку він вирішує перевернути лист і почати тренуватися.",
  "Everybody was happy birthdaying him the full day.": "Всі були щасливі його день народження цілий день.",
  "Everyone on the crew is good with a trowel, but damn that guy is really workin it today.": "Усі в команді добре працюють з травлом, але цей хлопець сьогодні дуже добре працює.",
  "Everyone's down with the flu, and I'm in the office all by myself.": "Всі хворіють на грип, а я в офісі сам.",
  "Everything hangs on whether the boss agrees.": "Все залежить від того, чи погоджується бос.",
  "Excessive drinking can bring on depression.": "Перебільшення алкоголю може привести до депресії.",
  "Exhausted, he called on his last ounce of strength.": "Виснажений, він з'явив останню силу.",
  "Face it. \"It's raining cats and dogs\" is an absurd yet evocative expression.": "Признай це. \"Плаває собаки і кішки\" - це абсурдна, але притягальна виразка.",
  "Fat chance that I’ll ever go back to Swansea.": "Має великий шанс, що я коли-небудь повернуся до Свансі.",
  "Fear of foreigners runs through that country at all levels of its society.": "Страх перед іноземцями поширюється в цій країні на всіх рівнях суспільства.",
  "Folks in our neighborhood come from every walk of life, prince and pauper, investor and janitor.": "Люди в нашому районі приїжджають з усіх умов життя, принц і бідний, інвестор і дворник.",
  "Following the divorce and the lawsuit, bankruptcy is just another nail in his coffin.": "Після розлучення і позову банкрутство - це ще один кісток у його труні.",
  "For a friend I’ll help out for free, no strings attached.": "Для друга я допоможу безкоштовно, без будь-яких обмежень.",
  "For goodness sake, will you stop keeping on about it!": "Хіба ти не перестанеш про це говорити?",
  "For my father's sake, I thought I must keep up appearances, but the food stuck in my throat, and I could not swallow another mouthful.": "Через батька я подумав, що мушу виглядати добре, але їжа застряхнула у моєму горлу і я не міг поглинути ще одну порцію.",
  "For the most part, the crowd was orderly.": "У більшості випадків натовп був організований.",
  "For the odd and curious of us, to fly like a bird is a not an easy thing.": "Для тих з нас, хто цікавиться, літати як птах - нелегка справа.",
  "For the young striker and the fans, it was love at first sight.": "Для молодого нападаюча і шанувальників це була любов на перший погляд.",
  "For your information, my son was a straight A student in college, so he's not just some schmo!": "Для вашої інформації, мій син був гей-а-студентом в коледжі, так що він не просто який-небудь шибань!",
  "Forgetting to finish a sentence with a period is one of my pet peeves.": "Забудьте закінчити речення з періодом - це один з моїх домашніх пищів.",
  "Fred bowled me a googly when he asked me to explain those statistics in the meeting.": "Коли Фред попросив мене пояснити ці статистичні дані на зустрічі, він похвалив мене.",
  "Fuel prices have gone through the roof since last fall.": "Ціни на паливо піднімалися з минулої осені.",
  "Germany's development of rocket weapons paved the way for human controlled spaceflight.": "Німецька розробка ракетних озброєнь відкрила шлях для людських космічних польотів.",
  "Get some more beer out of the fridge before we run out.": "Візьміть більше пива з холодильника, перш ніж ми закінчимо.",
  "Getting down with a bunch of old friends.": "З'їжджав з старим друзям.",
  "Give her time, and she may come around and see things your way.": "Дайте їй час, і вона може прийти і побачити речі на ваш погляд.",
  "Give me the bigger hammer. This little one just doesn’t cut the mustard.": "Дайте мені більший молоток.",
  "Give yourself a pat on the back for a job well done.": "За добре виконану роботу поцікавіть себе в спину.",
  "Grocery stores show off their produce by placing the most attractive specimens in front.": "Гандляри демонструють свою продукцію, розміщуючи найпривабливіші екземпляри перед ними.",
  "Halfway through the performance he just up and left.": "На півріччі виступу він просто піднявся і пішов.",
  "Hang a Louie up at the next stoplight.": "Вивесіть Луї на наступному ліхтарі.",
  "Hang a Ralph up at the next stoplight.": "Вивесіть Ралфа на наступному світині.",
  "Hang on to my jacket until I get back.": "Затримуй мою куртку, поки я не повернуся.",
  "Hang on to the handle so you don't drop it.": "Хватайся за ручку, щоб не випустити її.",
  "Hang on. Let me check.": "Почакай, я перевірю.",
  "Have you changed a tyre before? — Yes, once or twice.": "Ви колись змінювали шину?  ⁇  Так, раз або два.",
  "He accidentally walked in on me while I was undressing.": "Він випадково потрапив до мене, коли я роздягалася.",
  "He already has his hands full with two kids and a full-time job, yet he still makes time to volunteer.": "У нього вже багато дел з двома дітьми і роботою на повний робочий день, але він все ще робить час для волонтерства.",
  "He arrived at 10 o'clock, on the dot.": "Він прибув в 10 годин, на місці.",
  "He broke in with the New York Yankees.": "Він взламався з \"Нью-Йорк Янкіз\".",
  "He came out to his parents as gay last week.": "Він з'явився перед батьками як гей минулого тижня.",
  "He came through the surgery unharmed.": "Він пройшов операцію невшкоджений.",
  "He can't go on vacation very often because there is nobody to fill in for him.": "Він не може їхати на відпустку дуже часто, тому що немає нікого, щоб заповнити його.",
  "He could see the writing on the wall months before the business failed.": "Він міг бачити письмо на стіні за кілька місяців до того, як бізнес провалився.",
  "He decided to walk away from his job after expressing much dissatisfaction with his boss.": "Він вирішив піти з роботи після того, як висловив недовольність своїм начальником.",
  "He didn't give up his fandom when others did; he held on.": "Він не відмовлявся від фандому, коли інші; він тримався.",
  "He finally came down from his post-bonus high.": "Він, нарешті, вийшов з свого бонусу.",
  "He finished writing his paper and slid it under the door just in the nick of time.": "Він закінчив писати свою газету і прослізнув її під двері прямо вчасно.",
  "He got up me about the mess I made in the kitchen.": "Він розкрив мене про те, що я зробив в кухні.",
  "He grew disenchanted with playing second banana and never getting credit for the laughter.": "Він виріс розчарований тим, що грав в другому банану і ніколи не отримував почести за сміх.",
  "He had a lot to say, but his answer, in a nutshell, was no.": "У нього було багато чого сказати, але його відповідь, коротко кажучи, була ні.",
  "He had a reputation as a womanizer, but he swore blind that he had met the right girl in me and said he wanted to settle down.": "У нього була репутація женщини, але він присяг сліпо, що знайшов у мене правильну дівчину і сказав, що хоче заспокоїтися.",
  "He had been sitting there for two hours until the boss showed up and told him to get his ass in gear.": "Він сидів там протягом двох годин, поки начальник не з'явився і не сказав йому, щоб він приступив до роботи.",
  "He had the nerve to leave me standing there for hours with no food, no water, no nothing.": "У нього було сміливість залишити мене стояти там цілий час без їжі, води, нічого.",
  "He has no one to blame but himself; he was hoisted by his own petard.": "Він не має кого звинувачувати, крім самого себе; його підняв власний петард.",
  "He hit the nail on the head when he said the problem was the thermostat.": "Він ударив кинжал у голову, коли сказав, що проблема в термостаті.",
  "He hopes to break into show business.": "Він сподівається прорватися в шоу-бізнес.",
  "He hung up the flute after college.": "Він підвісив флейту після коледжу.",
  "He is a dead set fool.": "Він мертвий дурень.",
  "He just walked out and left her high and dry with two kids and a mortgage.": "Він просто вийшов і залишив її з двома дітьми і іпотекою.",
  "He laid on compliments.": "Він похвалився.",
  "He left me in the lurch and I had to finish the whole project by myself.": "Він залишив мене в приході і мені довелося завершити весь проект самостійно.",
  "He liked the house, so he made an offer on the spot.": "Йому сподобався будинок, тому він зробив пропозицію тут же.",
  "He looks like a used car salesman, but he's really on the level, so you can trust him.": "Він виглядає як продавець подержанних автомобілів, але він дійсно на рівні, так що ти можеш йому довіряти.",
  "He made 5000 bucks in drag racing.": "Він заробив 5000 баксів у гонках.",
  "He made an example of the drunken sailor with twenty lashes, to show that he must have a sober crew.": "Він зробив притчу про п'яного моряка з двадцять шляхами, щоб показати, що він повинен мати трезву екіпаж.",
  "He meant the world to her.": "Він значив для неї весь світ.",
  "He might pay back the money he borrowed without you reminding him, but I wouldn't hold my breath.": "Він може відплатити гроші, які він позичив, не нагадуючи йому про це, але я не затримую дихання.",
  "He once played golf with the grand poobah of their company.": "Він колись грав в гольф з великою паубою їхньої компанії.",
  "He passed the test with flying colors, as everyone had expected.": "Він пройшов тестування, як всі очікували.",
  "He passed up my invitation for dinner, saying he was too busy.": "Він пропустив мою запрошення на вечерю, сказав, що він занадто зайнятий.",
  "He pointed out the little brown bird in the tree.": "Він вказував на маленьку коричневу пташку на дереві.",
  "He pulled his gun out before she had a chance to scream.": "Він витягнув пістолет, перш ніж вона змогла кричати.",
  "He pulls in a lot of money.": "Він збирає багато грошей.",
  "He quit work on Friday, but on Monday he had a change of heart and decided to come back.": "Він пішов з роботи в п'ятницю, але в понеділок він змінив думку і вирішив повернутися.",
  "He quit working for the company and decided to go it alone as a consultant instead.": "Він відмовився від роботи в компанії і вирішив працювати сам як консультант.",
  "He ran off with my wallet.": "Він збег з моїм кошельком.",
  "He ran up over $5,000 in unpaid bills.": "Він потрапив до понад 5000 доларів в незаплачених рахунках.",
  "He really fell for the attractive waitress at his favorite restaurant.": "Він дійсно закохався у привабливу официантку у своєму улюбленому ресторані.",
  "He really took it to heart when I asked him to reconsider.": "Він дуже піклувався про це, коли я попросив його переосмислити.",
  "He retired last June, and his coworkers have seen neither hide nor hair of him since.": "Він пішов на пенсію в червні минулого року, і його колеги з роботи не бачили ні шкіри, ні волосся з нього з тих пір.",
  "He sat there, baffled, hoping nobody would call on him.": "Він сидів там, здивований, сподіваючись, що ніхто не відвідає його.",
  "He seemed to have all sports knowledge at his fingertips: we could scarcely finish a question before he had answered it.": "Здавалося б, він мав всі спортивні знання на кінцівках пальців: ми ледь могли закінчити питання, перш ніж він відповів на нього.",
  "He set off in search of better opportunities.": "Він відправився в пошуках кращих можливостей.",
  "He should stay off the dance floor with his two left feet.": "Він повинен не ходити на танцювальну площадку з двома лівими ногами.",
  "He smacked me around some. Didn't everybody's old man?": "Він мене трохи збив.",
  "He soured on the trumpet, so she never heard it again.": "Він засмутився на трубі, і вона більше не чула її.",
  "He started bucking up everything to management when he didn't get a raise.": "Він розпочав відкладати все керівництву, коли не отримав підвищення.",
  "He started to act up, but she sat on him.": "Він почав виступати, але вона сіла на нього.",
  "He sure cleans up nice.": "Він дуже добре чиститься.",
  "He talked to the cops and laid it on me.": "Він розмовляв з поліцейськими і наклав це на мене.",
  "He tends to make an exhibition of himself at parties, trying to draw attention.": "Він, як правило, демонструє себе на вечірках, намагаючись привернути увагу.",
  "He thinks it is quite a feather in his cap that he figured it out for himself.": "Він думає, що це досить перо в його шапці, що він винайшов це для себе.",
  "He told me whom he saw, but it went in one ear and out the other.": "Він сказав мені, кого він бачив, але він проник в одне вухо і вийшов з іншого.",
  "He took no notice of the spider until it bit him.": "Він не помітив паука, поки він не укусив його.",
  "He turned down all our offers of help.": "Він відкинув всі наші пропозиції про допомогу.",
  "He turned in his paperwork to the main office.": "Він віддав свої документи до головного офісу.",
  "He twiddled his thumbs for almost a week while he waited for somebody to set up his computer.": "Він майже тиждень закручував пальцями, чекаючи на те, щоб хтось встановив його комп'ютер.",
  "He walked on this year.": "Цього року він продовжив.",
  "He wants four copies of it? What for?": "Він хоче чотири копії?",
  "He wants to cut down on extra steps.": "Він хоче скоротити додаткові кроки.",
  "He wants to get out of there something awful, but he just doesn't have the money.": "Він хоче вийти звідти щось жахливе, але у нього просто немає грошей.",
  "He was born with a silver spoon in his mouth and probably never had to work a day in his life.": "Він народився з срібною ложкою в роті і, ймовірно, ніколи в житті не повинен був працювати.",
  "He was burning the midnight oil to finish his paper.": "Він спалював половину ночі нафту, щоб закінчити свою газету.",
  "He was still a babe in arms when his father died overseas.": "Він був ще дитиною, коли його батько помер за кордоном.",
  "He was very insulting. Finally Jack called him out and shut him up.": "Він був дуже оскорбляючий. Нарешті Джек назвав його і заткнувся.",
  "He went to the University of Kansas for almost two years before he dropped out.": "Він навчався в Університеті Канзасу майже два роки, перш ніж відмовився.",
  "He'll talk, once we work him over.": "Він розмовляє, як тільки ми його перепрацюємо.",
  "He's a funny old stick but I think you'll like him.": "Він смішний старяк, але я думаю, тобі сподобається.",
  "He's a year older than his classmates, because he was held back in second grade.": "Він на рік старший за своїх однокласників, тому що його затримали в другому класі.",
  "He's been hitting the bottle hard since his wife left him.": "Він сильно вбиває пляшку з тих пір, як його дружина залишила його.",
  "He's got a philosophy he hangs on to.": "У нього є філософія, яку він дотримується.",
  "He's stepping back from the role to let you start in it.": "Він відмовляється від ролі, щоб дозволити тобі почати.",
  "Her plain white dress was set off by a bright red stole.": "Її простої білої сукні було відпущено яскраво-червоним столом.",
  "Here in Texas, gas can go for as little as two dollars a gallon.": "Тут, в Техасі, бензин може виходити всього за два долари за галон.",
  "Hey you gals! How you doin'?": "Привіт, дівчата!",
  "Hey, hot stuff, wanna dance?": "Гаращі речі, хочеш потанцювати?",
  "Hey, wait up! I forgot my umbrella.": "Я забув свій парасоль.",
  "He’s always carrying on about his stupid aquarium.": "Він завжди говорить про свій дурний аквариум.",
  "His boss found him catching some z's at his desk yesterday.": "Його начальник знайшов його, коли ловив \"З\" на столі вчора.",
  "His ears are burning.": "Його вуха горять.",
  "His face rings a bell. I wonder if I know him from somewhere.": "Його обличчя звоніть звонок. Я цікава, чи я його звідкись знаю.",
  "His fashion designs are very on trend.": "Його модні дизайні дуже в тренді.",
  "His method certainly goes against the grain, but it is unquestionably effective.": "Його метод, безумовно, протистоїть, але він безсумнівно ефективний.",
  "His music really speaks to me.": "Його музика дійсно говорить мені.",
  "His new car has all the bells and whistles, but it doesn't move through traffic jams any faster.": "У його новій машині всі колочки і свистки, але вона не рухається через пробки швидше.",
  "Hold off (on) the decision one more day so I can answer your question.": "Затримуйте рішення ще один день, щоб я міг відповісти на ваше запитання.",
  "Hold on to my umbrella while I ride the roller coaster.": "Приймай мій парасоль, поки я їду по гірськолижній гонці.",
  "Hold on while I get my coat.": "Почакай, поки я принесу пальто.",
  "Hold the phone! We've had this problem before, with the other machine.": "Ми вже мали цю проблему з іншою машиною.",
  "Hold your fire and let me explain.": "Не стріляйте і дозвольте мені пояснити.",
  "How can you come up with such brilliant ideas?": "Як ви можете придумати такі бліскучі ідеї?",
  "How did she come across when you met with her?": "Як вона з'явилася, коли ви зустрілися з нею?",
  "How in thunderation could anyone anticipate a result like this?": "Як хтось міг передбачити такий результат?",
  "How long can they hold out without water?": "Як довго вони можуть витримати без води?",
  "How much do you suppose that fancy dress set her back?": "Як ви думаєте, скільки її відшкодила ця гаряча сукня?",
  "How well up are you on algebra?": "Наскільки добре ви в Алгебрі?",
  "How'd you pull up this morning?": "Як ти вийшла сьогодні?",
  "Hundreds of people turned out to see the parade.": "Сотні людей прийшли подивитися параду.",
  "I accidentally bumped into him, and he flipped me the bird.": "Я випадково зіткнулася з ним, і він перевернув мені птаха.",
  "I am extra careful while driving the car these days — these smartphone zombies can't be bothered to look up before crossing the street!": "Я дуже обережний, коли керуваю машиною в ці дні  ⁇  ці смартфонні зомбі не можуть заважати подивитися вгору, перш ніж перейти вулицю!",
  "I am holding out for more money.": "Я чекаю більше грошей.",
  "I am really at loose ends about this choice; I am between the proverbial rock and hard place.": "Я дійсно в розпущеніх краях з приводу цього вибору; я між скаловою скалою і жорстким місцем.",
  "I asked my colleague to stand in for me so I could take the day off.": "Я попросила колегу заступитися за мене, щоб я могла взяти відпустку.",
  "I bought a dozen melons before heading home, as you do.": "Я купив десятку мелонів перед тим, як пішов додому, як і ти.",
  "I can't believe how many people still fall for the coin glued to the sidewalk.": "Я не можу повірити, скільки людей все ще потрапляють на монету, приклеєну на тротуар.",
  "I can't do it by myself, and neither can you – it takes two to tango.": "Я не можу це зробити сам, і ти теж не можеш.",
  "I can't find my keys, so I'll look around.": "Я не можу знайти свої ключі, тому подивимуся навколо.",
  "I cannot think of any good examples off the top of my head, but give me a couple of hours and I'm sure I could come up with something.": "Я не можу пригадати хороших прикладів, але дай мені пару годин, і я впевнений, що можу щось придумати.",
  "I couldn't see how to finish the project, so I backed up and tried it another way.": "Я не бачив, як закінчити проект, тому відступив і спробував іншим способом.",
  "I decided to splash out on a trip around Europe after getting a nice Christmas bonus.": "Я вирішив поїхати по Європі після того, як отримав хороший різдвяний бонус.",
  "I didn't have any other options, I was backed into it.": "У мене не було іншого вибору, я був закордонний.",
  "I didn't know what a mitochondrion was until I looked it up in a dictionary.": "Я не знав, що таке мітохондріон, поки не шукав його в словнику.",
  "I don't agree, but they make him for a criminal.": "Я не згоден, але вони роблять його злочинцем.",
  "I don't like his political ideas, but I will hold my tongue.": "Мені не подобаються його політичні ідеї, але я буду триматися моєї мови.",
  "I don't mind if he stays there, as long as he cleans up after himself when he's done.": "Мені не шкода, якщо він залишиться там, поки він чиститься після себе, коли закінчить.",
  "I don't mind if he stays there, so long as he cleans up after himself when he's done.": "Мені не шкода, якщо він залишиться там, поки він чиститься після себе, коли закінчить.",
  "I don't really understand him; we're just not on the same wavelength.": "Я не розумію його, ми просто не на одній хвилі.",
  "I don't recommend taking on that bully, since he's bigger than you are.": "Я не рекомендую взяти на себе цього викупу, оскільки він більший, ніж ти.",
  "I don't think another child is in the cards for them.": "Я не думаю, що ще одне дитину вони можуть отримати.",
  "I don't think he's holding up his end of the bargain.": "Я не думаю, що він тримає свою частину угоди.",
  "I don't want to run around all week getting everything ready for the holidays.": "Я не хочу весь тиждень ходити навколо, готуючи все на свята.",
  "I drew the short straw and got stuck doing the whole project alone.": "Я витягнув коротку солому і застряг, роблячи весь проект один.",
  "I dropped by on Thursday, but you were out.": "Я приїхав у четвер, але ти не був.",
  "I eat fish any more.": "Я більше їжу рибу.",
  "I feel that somebody has to speak up for those oppressed by the system.": "Я відчуваю, що хтось повинен виступити за тих, хто пригнічений системою.",
  "I finally broke into the second package of cookies.": "Я, нарешті, вламав у другий пакет печиво.",
  "I finally gave in and let him stay up to watch TV.": "Врешті-решт я здався і дозволив йому стояти і дивитися телевізор.",
  "I finished in five minutes and she showed me up by finishing in three.": "Я закінчив за п'ять хвилин, а вона показала, що закінчила за три.",
  "I get a feeling Kurt Cobain is looking down on Nickelback and wondering what alternative rock has become.": "У мене є відчуття, що Курт Кобейн дивиться вниз на \"Нікельбек\" і цікавиться, що стало альтернативною рок-роком.",
  "I get one parking ticket and he holds it over my head for six months.": "Я отримую один квиток на парковку і він тримає його над моєю головою протягом шести місяців.",
  "I got accepted to Yale! —Shut up, really? That's awesome!": "Я був прийнятий в Йель!",
  "I got picked for the cheerleading squad, and YOU didn't. In your face!": "Мене вибрали в жіночу команду, а тебе - ні.",
  "I had a frog in my throat and the words didn't come out very clearly.": "У мене була жаба у горлі і слова не виходили дуже чітко.",
  "I had been out of touch with my old friend for a long time when she called.": "Я давно не зв'язався з старою подругою, коли вона зателефонувала.",
  "I had hoped our first meeting would turn out better.": "Я сподівався, що наша перша зустріч буде краще.",
  "I had just put Mary down when you rang. So now she's crying again.": "Я просто поклав Мері, коли ти зателефонував, і тепер вона знову плаче.",
  "I had no idea that one simple comment would set off such a huge argument.": "Я не знала, що одна проста відповідь може викликати такий величезний спор.",
  "I had to get up at oh dark thirty to catch a plane.": "Мені довелося вставати в о тёмні тридцять, щоб потрапити на літак.",
  "I hate to burst his bubble, but he is going to be disappointed if he tries that idea.": "Я ненавижу розбурити його пузырь, але він буде розчарований, якщо спробує цю ідею.",
  "I have been dragging my feet about filing my taxes.": "Я перетягнув свої ноги про подачу податків.",
  "I have been up to here in paperwork all week.": "Я тут весь тиждень працював з документами.",
  "I have doubts about your plan, but I'll play along for now.": "У мене є сумніви щодо вашого плану, але я зіграю з вами.",
  "I have fixed the parts I understand, and the rest leaves me at a loss.": "Я виправив ті частини, які я розумію, а решта залишає мене в потере.",
  "I have had it up to here with your nonsense!": "Мені довелося до цього з вашими безглуздями!",
  "I have spent all morning running around after the kids.": "Я весь ранок ходив за дітьми.",
  "I have to shoot off: my interview starts in under an hour.": "Я повинен піти: мій інтерв'ю починається менш ніж через годину.",
  "I haven't told him yet, I'm still playing along with his scheme.": "Я ще не сказав йому, я все ще граю з його схемою.",
  "I heard they wanted to cancel the show tonight. – Not even!": "Я чув, що вони хотіли скасувати шоу сьогодні.",
  "I heard through the grapevine that she likes him.": "Я чув через винограду, що вона любить його.",
  "I heard you been chatting up my girl. What's the big idea?": "Я чула, що ти розмовляла з моїм дівчиною.",
  "I held down that job for years.": "Я тримав цю роботу протягом багатьох років.",
  "I hope my comments yesterday were not out of line.": "Я сподіваюся, що мої вчорашні коментарі не були виходячими з строку.",
  "I hoped to park in the members' area but the attendant showed me the red card.": "Я сподівався паркувати в зоні членів, але слуга показав мені червону картку.",
  "I hung up my wash on the line.": "Я підвешав мою митьку на лінії.",
  "I just finished wrapping up the presents. Mission accomplished! Now for the next thing...": "Я тільки-но завершив упаковку подарунків, мисія завершена!",
  "I just found out that my ex-wife, who never wanted children, now has two kids called, wait for it, Ludwig and Balthazar.": "Я тільки що дізнався, що моя колишня дружина, яка ніколи не хотіла дітей, тепер має двох дітей, які клічуть, чекають, Людвіга і Балтазара.",
  "I knew as soon I met him that John was the one for me and we were married within a month.": "Я знав, як тільки познайомився з ним, що Джон був для мене і ми одружилися протягом місяця.",
  "I knew that my blind date was an April Fools trick, but I played along anyway.": "Я знав, що мій сліпий побачення був April Fools трюк, але я зіграв з ним все одно.",
  "I know we’re never going to agree on the merits of vegetarianism, so let’s agree to disagree, shall we?": "Я знаю, що ми ніколи не погодимося на переваги вегетаріанства, тому давайте погодимося не погодитися, так?",
  "I laid him out on the sidewalk after he tried to grab me.": "Я поклала його на тротуар після того, як він намагався мене поймати.",
  "I learned to drive stick at a young age.": "Я навчився їздити палкою в молодому віці.",
  "I like to practise guitar by playing along with records.": "Я люблю практикувати гітару, граючи разом з записами.",
  "I look on him not as a boss, but as a friend.": "Я дивлюся на нього не як на боса, а як на друга.",
  "I lucked out and got the last two tickets to the big show.": "Мені пощастило, і я отримав останні два квитки до великого шоу.",
  "I managed to hunt down a surviving copy of the magazine.": "Мені вдалося знайти збережену копію журналу.",
  "I must keep an eye on this sauce in case it curdles.": "Я мушу спостерігати за цим соусом, якщо він закрутиться.",
  "I need to get a move on if I'm going to arrive before dark.": "Мені потрібно поспішати, якщо я збираюся прибути до темряви.",
  "I need to take the rubbish bag out.": "Мені потрібно вивезти мусорну сумку.",
  "I never saw her without glasses before, so it threw me off when she got contact lenses.": "Я ніколи не бачив її без окулярів раніше, так що я здивувався, коли вона отримала контактні лінзи.",
  "I only said that she wasn't as young as she used to be, and her response was out of proportion.": "Я тільки сказав, що вона вже не молода, як раніше, і її відповідь була непропорційною.",
  "I originally thought that it was a good idea, but on second thought I'm not so sure.": "Спочатку я думав, що це хороша ідея, але після передумів не так впевнений.",
  "I passed the test by the skin of my teeth.": "Я пройшов тест за шкірою зубів.",
  "I pull up the lever when I want to make my car go into first gear.": "Я піднімаю рычаг, коли хочу, щоб моя машина пішла на перший колір.",
  "I put the high crime rate down to the high unemployment.": "Я ставлю високий рівень злочинності до високого безробіття.",
  "I put up with a lot of nonsense, but this is too much.": "Я терпила багато невинних речей, але це занадто багато.",
  "I ran through my wages in two days. Now I've got to live on next to nothing till Friday!": "Я переглянула зарплату за два дні.",
  "I really got a kick out of that clown's juggling act.": "Мені дуже сподобався жонглируючий акт цього клоуна.",
  "I really put my foot in my mouth during the interview.": "Я дійсно кинув ногу в рот під час інтерв'ю.",
  "I really should call on my aunt more often.": "Я дійсно повинен частіше відвідувати мою тіту.",
  "I really wish you wouldn't carry on like that in public!": "Я б дуже хотіла, щоб ти так не ходила на публіці!",
  "I saw him run out on the check at a burger joint.": "Я бачив, як він вибег з чека в бургерському ресторані.",
  "I saw your friend William the other day. He says hi.": "Я побачив вашого друга Вільяма.",
  "I searched for my glasses for twenty minutes, and finally found them right under my nose.": "Я 20 хвилин шукав свої окуляри, і нарешті знайшов їх прямо під носом.",
  "I sent the boss my proposal three weeks ago and he's just been sitting on it.": "Я надіслала боску свою пропозицію три тижні тому і він просто сидить на ній.",
